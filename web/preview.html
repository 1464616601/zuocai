    '段', '张', '粒', '朵', '撮', '滴', '寸', 'oz', 'lb',
  ];

  const AMOUNT_WORDS = ['适量', '少许', '少量', '若干', '随意', '可选', '按需', '一点点', '一点'];

  const CN_NUM = '０-９0-9一二三四五六七八九十百半两几';

  const RE_TRAILING_QTY = new RegExp(
    '^(.+?)[\\s:：]*(' +
      `[${CN_NUM}]+(?:\\.\\d+)?\\s*(?:${UNIT.join('|')})` +
      '|' + AMOUNT_WORDS.join('|') +
    ')$'
  );
  const RE_LEADING_QTY = new RegExp('^(' + AMOUNT_WORDS.join('|') + ')(.+)$');
  const RE_NUM_START = /^[0-9０-９][0-9０-９.]*\s*.*$/;

  const ING_WORDS = '食材|用料|材料|原料|主料|配料|辅料|调料|所需材料|准备材料|食材清单|用料清单';
  const STEP_WORDS = '步骤|做法|烹饪步骤|制作步骤|制作方法|烹饪方法|操作步骤|流程|方法|详细步骤';
  const TIP_WORDS = '小贴士|贴士|提示|注意|注意点|tips?|备注|心得';
  const NAME_WORDS = '菜名|名称|菜品|标题';

  const RE_ING_HEAD = new RegExp(`^(${ING_WORDS})[：:]?$`);
  const RE_STEP_HEAD = new RegExp(`^(${STEP_WORDS})[：:]?$`);
  // 贴士必须「独占一行」或「带冒号」：否则「注意油温再下锅」这种步骤行
  // 会被误判成贴士，把后面的步骤全吞进 tips
  const RE_TIP_HEAD = new RegExp(`^(${TIP_WORDS})(?:[：:]\\s*(.*))?$`, 'i');
  const RE_ING_INLINE = new RegExp(`^(${ING_WORDS})[：:]\\s*(.+)$`);
  const RE_STEP_INLINE = new RegExp(`^(${STEP_WORDS})[：:]\\s*(.+)$`);
  const RE_NAME_INLINE = new RegExp(`^(${NAME_WORDS})[：:]\\s*(.+)$`);
  // 模型有时把模板里的「# 菜名」原样输出，这种标题不是真菜名
  const RE_PLACEHOLDER_NAME = /^(菜名|名称|菜品|菜品名|菜谱名|食谱名|标题)$/;

  // 明确是编号列表（数字 / 圆圈数字），任何语境下都视为步骤
  const STEP_NUM_STRICT = /^\s*(?:\(?\d{1,2}\)?[.、)．]|[①-⑩]|\d{1,2}\s*[.、])\s*/;
  // 项目符号，仅在步骤语境下视为步骤标记
  const STEP_BULLET = /^\s*[-*•·]\s+/;

  const ING_SPLIT = /[、，,；;]+/;

  // ---------------------------------------------------------------- 视频链接
  // 和 Kotlin 端 data/VideoLink.kt 保持同一套规则

  const VIDEO_DIRECT_EXT = ['.mp4', '.m3u8', '.webm', '.mov', '.m4v'];
  const VIDEO_TRAILING = '，。；、）】」』》》,;！？…';
  // 排掉中文标点：分享文案常写成 `http://xhslink.com/a/xxx，复制本条信息`，中间没有空格
  const RE_VIDEO_URL = /https?:\/\/[^\s<>"'，。；、）】」』》！？…]+/i;
  const RE_BV = /BV[0-9A-Za-z]{10}/;

  function trimVideoTail(u) {
    let s = String(u || '');
    while (s && VIDEO_TRAILING.includes(s[s.length - 1])) s = s.slice(0, -1);
    return s;
  }

  /** 从任意文本里取视频地址（兼容整段分享文案） */
  function extractVideoUrl(raw) {
    const text = String(raw || '').trim();
    if (!text) return '';
    // 统一走正则：URL 本身不含空格和中文标点，开头截断和中间截断是同一套规则
    const m = text.match(RE_VIDEO_URL);
    return m ? trimVideoTail(m[0]) : '';
  }

  /**
   * 输入框专用：允许只填 `b23.tv/abc` 这种不带协议头的地址。
   * 只在「整串看起来像一个域名」时才补 https://，避免把中文正文硬拼成链接。
   */
  function normalizeVideoUrl(raw) {
    const text = String(raw || '').trim();
    if (!text) return '';
    const direct = extractVideoUrl(text);
    if (direct) return direct;

    const head = text.split('\n')[0].split(' ')[0].trim();
    if (head.length >= 4 && head.length <= 300 && head.includes('.') && !head.includes(' ') &&
        !/^https?:\/\//i.test(head)) {
      return extractVideoUrl('https://' + head);
    }
    return '';
  }

  /** direct / bilibili / external，空串表示没有视频 */
  function detectVideoType(url) {
    const u = String(url || '').trim().toLowerCase();
    if (!u) return '';
    if (u.includes('bilibili.com') || u.includes('b23.tv')) return 'bilibili';

    const path = u.split('?')[0].split('#')[0];
    if (VIDEO_DIRECT_EXT.some((ext) => path.endsWith(ext))) return 'direct';
    return 'external';
  }

  /** B 站官方播放器地址；解析不出 BV 号返回 null */
  function bilibiliEmbed(url) {
    const m = String(url || '').match(RE_BV);
    if (!m) return null;
    return 'https://player.bilibili.com/player.html?bvid=' + m[0] +
      '&autoplay=0&high_quality=1&danmaku=0';
  }

  function videoCanPlayInside(url, type) {
    const t = type || detectVideoType(url);
    if (t === 'direct') return true;
    if (t === 'bilibili') return !!bilibiliEmbed(url);
    return false;
  }

  function videoSiteLabel(url) {
    const u = String(url || '').toLowerCase();
    if (u.includes('xiaohongshu.com') || u.includes('xhslink.com')) return '小红书';
    if (u.includes('bilibili.com') || u.includes('b23.tv')) return '哔哩哔哩';
    if (u.includes('douyin.com') || u.includes('iesdouyin.com')) return '抖音';
    if (u.includes('kuaishou.com')) return '快手';
    if (u.includes('weibo.com') || u.includes('weibo.cn')) return '微博';
    if (u.includes('ixigua.com')) return '西瓜视频';
    if (u.includes('youtube.com') || u.includes('youtu.be')) return 'YouTube';
    if (u.includes('mp.weixin.qq.com')) return '公众号';
    if (u.includes('zhihu.com')) return '知乎';
    return '视频';
  }

  /** 去掉 Markdown 标记，保留文字 */
  // 导出 TXT 用的中文名（和 Kotlin 端 RecipeCategory.textOf / Difficulty.textOf 对齐）
  const CAT_TEXT = {
    home: '家常菜', soup: '汤羹', staple: '主食',
    cold: '凉菜', dessert: '甜点', other: '其他',
  };
  const CAT_BY_TEXT = {
    '家常菜': 'home', '汤羹': 'soup', '汤': 'soup', '主食': 'staple',
    '凉菜': 'cold', '甜点': 'dessert', '甜品': 'dessert', '其他': 'other',
  };
  const DIFF_TEXT = ['简单', '中等', '有点难'];

  function stripMd(s) {
    return String(s || '')
      .replace(/\*\*(.+?)\*\*/g, '$1')
      .replace(/__(.+?)__/g, '$1')
      .replace(/(^|[^*])\*(?!\s)(.+?)(?<!\s)\*/g, '$1$2')
      .replace(/`([^`]+)`/g, '$1')
      .replace(/~~(.+?)~~/g, '$1')
      .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')
      .replace(/\s+/g, ' ')
      .trim();
  }

  /** 单个食材 → {n, a} */
  function splitIngredient(raw) {
    let s = stripMd(raw).replace(/^[-*•·\s]+/, '').trim();
    s = s.replace(/^[：:]\s*/, '');
    if (!s) return null;

    // 量词在前：少许白糖
    const lead = s.match(RE_LEADING_QTY);
    if (lead && lead[2].trim()) {
      return { n: lead[2].trim(), a: lead[1] };
    }

    // 名称 + 末尾用量
    const tail = s.match(RE_TRAILING_QTY);
    if (tail && tail[1].trim()) {
      return { n: tail[1].trim(), a: tail[2].trim() };
    }

    // 空格分隔、后半以数字开头：鸡蛋 2个
    const parts = s.split(/\s+/);
    if (parts.length >= 2) {
      const last = parts[parts.length - 1];
      if (RE_NUM_START.test(last)) {
        return { n: parts.slice(0, -1).join(' '), a: last };
      }
    }

    return { n: s, a: '' };
  }

  /** 一行食材文本 → 数组 */
  function parseIngredientLine(line) {
    const out = [];
    stripMd(line)
      .replace(/^[-*•·]\s+/, '')
      .split(ING_SPLIT)
      .forEach((seg) => {
        const item = splitIngredient(seg);
        if (item && (item.n || item.a)) out.push(item);
      });
    return out;
  }

  /** 根据菜名与食材猜分类 */
  function guessCategory(name, ingredients) {
    const t = (String(name || '') + ' ' + (ingredients || []).map((i) => i.n).join(' ')).toLowerCase();
    if (/(汤|羹|煲|锅仔|炖盅)/.test(t)) return 'soup';
    if (/(凉拌|拌菜|沙拉|冷盘|口水)/.test(t)) return 'cold';
    if (/(蛋糕|布丁|甜品|糖水|饼干|派|酥|奶冻|慕斯|双皮奶)/.test(t)) return 'dessert';
    if (/(炒饭|拌饭|焖饭|盖饭|面条|拉面|炒面|汤面|米粉|河粉|粥|饺子|包子|馒头|花卷|烙饼|煎饼|年糕|意面|披萨)/.test(t)) return 'staple';
    return 'home';
  }

  /**
   * 主解析入口
   * @returns {{name, ingredients, steps, tips, category, ok, hints}}
   */
  function parseRecipe(text) {
    const result = {
      name: '', ingredients: [], steps: [], tips: '',
      category: 'home', videoUrl: '', videoType: '', ok: false, hints: [],
    };
    const rawText = String(text || '').replace(/\r\n?/g, '\n');
    if (!rawText.trim()) return result;

    const lines = rawText.split('\n');
    let mode = 'name'; // name | ing | step | tip | awaitName
    let nameFound = false;
    const tipLines = [];
    const stepBuffer = [];
    const meta = {};

    for (let i = 0; i < lines.length; i++) {
      const rawLine = lines[i];
      if (!rawLine.trim()) continue;

      const isQuote = /^\s*>/.test(rawLine);
      const plain = stripMd(rawLine.replace(/^\s*>\s?/, ''));
      if (!plain) continue;

      // ---- 0. 导出文件带的元信息：@分类：家常菜 / @时长：45分钟
      if (plain.startsWith('@')) {
        readMetaLine(plain, meta);
        continue;
      }

      // ---- 1. 贴士（优先级最高，"小贴士："开头的行不进正文）
      const mTip = plain.match(RE_TIP_HEAD);
      if (mTip) {
        const body = String(mTip[2] || '').trim();
        if (body) tipLines.push(body);
        mode = 'tip';
        continue;
      }

      // ---- 2. Markdown 标题
      const h = rawLine.match(/^\s*(#{1,6})\s+(.*)$/);
      if (h) {
        const title = stripMd(h[2]);
        if (RE_ING_HEAD.test(title)) { mode = 'ing'; continue; }
        if (RE_STEP_HEAD.test(title)) { mode = 'step'; continue; }
        if (!nameFound) {
          nameFound = true;
          if (RE_PLACEHOLDER_NAME.test(title.trim())) {
            // 等下一行的真实菜名
            mode = 'awaitName';
          } else {
            result.name = title;
            mode = 'ing';
          }
        } else {
          mode = 'ing';
        }
        continue;
      }

      // ---- 3. 前缀式：菜名：xxx
      const mName = plain.match(RE_NAME_INLINE);
      if (mName) {
        result.name = mName[2].trim();
        nameFound = true;
        mode = 'ing';
        continue;
      }

      // ---- 4. 前缀式：食材：xxx
      const mIng = plain.match(RE_ING_INLINE);
      if (mIng) {
        mode = 'ing';
        parseIngredientLine(mIng[2]).forEach((it) => result.ingredients.push(it));
        continue;
      }

      // ---- 5. 前缀式：步骤：xxx
      const mStep = plain.match(RE_STEP_INLINE);
      if (mStep) {
        mode = 'step';
        stepBuffer.push(mStep[2]);
        continue;
      }

      // ---- 6. 纯文本段落标题（食材 / 步骤 / 小贴士 独占一行）
      if (RE_ING_HEAD.test(plain)) { mode = 'ing'; continue; }
      if (RE_STEP_HEAD.test(plain)) { mode = 'step'; continue; }

      // ---- 7. 引用行
      if (isQuote) {
        if (plain) tipLines.push(plain);
        continue;
      }

      // ---- 8. 首个非空行兜底当菜名
      if (!nameFound && mode === 'name') {
        const first = plain.replace(/^[#\s]+/, '').trim();
        nameFound = true;
        if (RE_PLACEHOLDER_NAME.test(first)) {
          mode = 'awaitName';
        } else {
          result.name = first;
          mode = 'ing';
        }
        continue;
      }

      // 7.5 上一行是「# 菜名」这类占位标题，用这一行的内容当真实菜名
      if (mode === 'awaitName') {
        const real = plain.replace(/^[#\s]+/, '').trim();
        if (real && !RE_ING_HEAD.test(real) && !RE_STEP_HEAD.test(real)) {
          result.name = real;
          mode = 'ing';
          continue;
        }
      }

      // ---- 9. 编号行 → 切到步骤（食材区里出现 1. 2. 说明步骤开始了）
      if (mode !== 'step' && STEP_NUM_STRICT.test(rawLine)) {
        mode = 'step';
        stepBuffer.push(rawLine);
        continue;
      }

      // ---- 10. 按当前模式归集
      if (mode === 'ing') {
        parseIngredientLine(rawLine).forEach((it) => result.ingredients.push(it));
      } else if (mode === 'step') {
        stepBuffer.push(rawLine);
      } else if (mode === 'tip') {
        tipLines.push(plain);
      } else {
        parseIngredientLine(rawLine).forEach((it) => result.ingredients.push(it));
      }
    }

    // 合并步骤：编号行开新步骤，未编号行并入上一步
    let current = '';
    const flush = () => {
      const t = stripMd(current).trim();
      if (t) result.steps.push(t);
      current = '';
    };
    for (const line of stepBuffer) {
      const numbered = STEP_NUM_STRICT.test(line) || STEP_BULLET.test(line);
      const cleaned = line
        .replace(STEP_NUM_STRICT, '')
        .replace(STEP_BULLET, '')
        .trim();
      if (!cleaned) continue;
      if (numbered) {
        flush();
        current = cleaned;
      } else if (!current) {
        current = cleaned;
      } else {
        current += ' ' + cleaned;
      }
    }
    flush();

    result.tips = tipLines.filter(Boolean).join(' ');

    // 归一化
    if (result.name) {
      result.name = result.name.replace(/^[《【\[]+|[》】\]]+$/g, '').trim();
    }
    result.ingredients = dedupeIngredients(result.ingredients);

    // 导出文件里带了元信息就用它，否则按菜名猜分类
    result.category = CAT_BY_TEXT[(meta['分类'] || '').trim()] ||
      guessCategory(result.name, result.ingredients);
    result.minutes = firstInt(meta['时长']) ?? 0;
    result.servings = firstInt(meta['份量']) ?? 2;
    result.difficulty = parseDifficulty(meta['难度']);

    // `@视频：` 里可能粘的是整段分享文案，抠出真正的链接再判类型
    result.videoUrl = normalizeVideoUrl(meta['视频'] || meta['video'] || '');
    result.videoType = result.videoUrl ? detectVideoType(result.videoUrl) : '';

    if (!result.name) result.hints.push('没识别到菜名，可在第一行写 # 菜名');
    if (!result.ingredients.length) result.hints.push('没识别到食材，检查是否有「### 食材」小标题');
    if (!result.steps.length) result.hints.push('没识别到步骤，检查是否有「### 步骤」小标题');

    result.ok = !!result.name && (result.ingredients.length > 0 || result.steps.length > 0);
    return result;
  }

  /** 读取一行 `@键：值` */
  function readMetaLine(line, out) {
    const body = line.replace(/^@/, '').trim();
    const m = body.match(/^([^：:]+)[：:]\s*(.+)$/);
    if (m && m[1].trim() && m[2].trim()) out[m[1].trim()] = m[2].trim();
  }

  function firstInt(text) {
    const m = String(text || '').match(/\d+/);
    return m ? Number(m[0]) : null;
  }

  function parseDifficulty(text) {
    const t = String(text || '').trim();
    if (t.includes('难')) return 3;
    if (t.includes('中')) return 2;
    return 1;
  }

  /** 去重（同名食材只留第一次出现的用量） */
  function dedupeIngredients(list) {
    const seen = new Set();
    const out = [];
    for (const it of list) {
      const key = (it.n || '').trim();
      if (!key) {
        if (it.a) out.push(it);
        continue;
      }
      if (seen.has(key)) continue;
      seen.add(key);
      out.push(it);
    }
    return out;
  }

  /** 菜谱 → 文本（编辑时回填） */
  function stringifyRecipe(recipe) {
    const ings = (recipe.ingredients || [])
      .filter((i) => i.n || i.a)
      .map((i) => (i.a ? `${i.n} ${i.a}` : i.n))
      .join('、');

    const steps = (recipe.steps || [])
      .filter((s) => s && s.trim())
      .map((s, i) => `${i + 1}. ${s}`)
      .join('\n');

    const parts = [`# ${recipe.name || '未命名菜谱'}`, ''];

    // 元信息：导出 TXT 时带上，导入到另一台手机才能还原分类与份量
    parts.push(`@分类：${CAT_TEXT[recipe.category] || '其他'}`);
    if (Number(recipe.minutes) > 0) parts.push(`@时长：${Number(recipe.minutes)}分钟`);
    if (Number(recipe.servings) > 0) parts.push(`@份量：${Number(recipe.servings)}人份`);
    parts.push(`@难度：${DIFF_TEXT[(Number(recipe.difficulty) || 1) - 1] || '简单'}`);
    if (recipe.videoUrl && String(recipe.videoUrl).trim()) {
      parts.push(`@视频：${String(recipe.videoUrl).trim()}`);
    }

    parts.push('', '### 食材', ings, '', '### 步骤', steps);

    if (recipe.description && recipe.description.trim()) {
      parts.push('', `> 小贴士：${recipe.description.trim()}`);
    }
    return parts.join('\n');
  }

  /** 分隔行：4 个以上等号独占一行，菜谱正文里基本不会出现 */
  const RE_SPLIT = /^={4,}.*$/m;

  /** 多道菜谱 → 一个 TXT */
  function exportAll(recipes) {
    if (!recipes || !recipes.length) return '';
    return recipes
      .map((r, i) => `==========  菜谱 ${i + 1}  ==========\n\n${stringifyRecipe(r)}`)
      .join('\n\n');
  }

  /** TXT → 若干段落 */
  function splitBlocks(text) {
    return String(text || '')
      .replace(/\r\n?/g, '\n')
      .split(RE_SPLIT)
      .map((x) => x.trim())
      .filter(Boolean);
  }

  /** 建议的导出文件名 */
  function suggestFileName(d = new Date()) {
    const p = (n) => String(n).padStart(2, '0');
    const stamp = `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-` +
      `${p(d.getHours())}${p(d.getMinutes())}`;
    return `我的菜谱-${stamp}.txt`;
  }

  return {
    parseRecipe, stringifyRecipe, splitIngredient, stripMd, guessCategory,
    exportAll, splitBlocks, suggestFileName,
    extractVideoUrl, normalizeVideoUrl, detectVideoType, bilibiliEmbed,
    videoCanPlayInside, videoSiteLabel,
  };
});

</script>
<script>
/* 放松小游戏 · 与菜谱 App 内置的五个小游戏
   纯 Canvas 实现，无外部依赖。接口约定：

     const game = Games.create(key, canvas)
     game.resize(w, h)       // 画布尺寸变化
     game.update(dt)         // dt 毫秒
     game.render(ctx)
     game.input(action)      // up / down / left / right / a / b
     game.state              // { score, over, paused, label }

   每个游戏自己管状态，宿主只负责循环、计分板和按键。
*/
(function (root) {
  'use strict';

  const C = {
    // 街机暗色主题：与 Android 端 GameStyle 一致
    bg: '#17130F',
    grid: '#352C23',
    ink: '#F3E9DC',
    sub: '#8A7A6C',
    brand: '#E2571E',
    brand2: '#F08A4B',
    soft: '#F6E0CE',
    good: '#3E9A5C',
    warn: '#F2A03D',
    white: '#FFFFFF',
    darkPanel: '#241E18',
    light: '#F3E9DC',
    red: '#E9536F',
  };

  const rnd = (n) => Math.floor(Math.random() * n);
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

  // 圆角矩形（部分浏览器没有 roundRect）
  function rr(ctx, x, y, w, h, r) {
    const rad = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rad, y);
    ctx.arcTo(x + w, y, x + w, y + h, rad);
    ctx.arcTo(x + w, y + h, x, y + h, rad);
    ctx.arcTo(x, y + h, x, y, rad);
    ctx.arcTo(x, y, x + w, y, rad);
    ctx.closePath();
  }

  function fillRR(ctx, x, y, w, h, r, color) {
    ctx.fillStyle = color;
    rr(ctx, x, y, w, h, r);
    ctx.fill();
  }

  function text(ctx, str, x, y, size, color, align, weight) {
    ctx.fillStyle = color || C.ink;
    ctx.font = `${weight || 600} ${size}px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif`;
    ctx.textAlign = align || 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(str, x, y);
  }

  /* ================================================================
     1. 贪吃蛇
     ================================================================ */
  function Snake() {
    const COLS = 15;
    const ROWS = 22;
    let cell = 16;
    const state = { score: 0, over: false, paused: false, label: '', events: [] };

    let snake, dir, nextDir, food, acc, stepMs, alive, started;

    function reset() {
      snake = [{ x: 7, y: 11 }, { x: 7, y: 12 }, { x: 7, y: 13 }];
      dir = { x: 0, y: -1 };
      nextDir = { x: 0, y: -1 };
      acc = 0;
      stepMs = 150;
      alive = true;
      started = false;
      state.score = 0;
      state.over = false;
      placeFood();
    }

    function placeFood() {
      let tries = 0;
      do {
        food = { x: rnd(COLS), y: rnd(ROWS) };
        tries++;
      } while (tries < 200 && snake.some((s) => s.x === food.x && s.y === food.y));
    }

    function step() {
      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      if (head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS) {
        alive = false;
        state.over = true;
        state.events.push('over');
        return;
      }
      if (snake.some((s) => s.x === head.x && s.y === head.y)) {
        alive = false;
        state.over = true;
        state.events.push('over');
        return;
      }

      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        state.score += 10;
        placeFood();
        if (stepMs > 70) stepMs -= 3;
        state.events.push('eat');
      } else {
        snake.pop();
      }
    }

    reset();

    return {
      state,
      reset,
      resize(w, h) {
        cell = Math.floor(Math.min(w / COLS, (h - 8) / ROWS));
      },
      input(a) {
        const map = {
          up: { x: 0, y: -1 }, down: { x: 0, y: 1 },
          left: { x: -1, y: 0 }, right: { x: 1, y: 0 },
        };
        const d = map[a];
        if (!d) return;
        // 不能直接反向
        if (d.x === -dir.x && d.y === -dir.y) return;
        nextDir = d;
        started = true;
      },
      update(dt) {
        if (state.over || !alive) return;
        state.label = started ? '' : '按方向键开始';
        if (!started) return;
        acc += dt;
        while (acc >= stepMs) {
          acc -= stepMs;
          step();
          if (state.over) break;
        }
      },
      render(ctx, w, h) {
        const ox = Math.floor((w - COLS * cell) / 2);
        const oy = Math.floor((h - ROWS * cell) / 2);

        ctx.fillStyle = C.bg;
        ctx.fillRect(0, 0, w, h);

        // 棋盘底纹
        ctx.strokeStyle = C.grid;
        ctx.lineWidth = 1;
        for (let i = 0; i <= COLS; i++) {
          ctx.beginPath();
          ctx.moveTo(ox + i * cell, oy);
          ctx.lineTo(ox + i * cell, oy + ROWS * cell);
          ctx.stroke();
        }
        for (let j = 0; j <= ROWS; j++) {
          ctx.beginPath();
          ctx.moveTo(ox, oy + j * cell);
          ctx.lineTo(ox + COLS * cell, oy + j * cell);
          ctx.stroke();
        }

        // 食物：光晕 + 实心
        ctx.fillStyle = C.red;
        ctx.globalAlpha = 0.18;
        ctx.beginPath();
        ctx.arc(ox + food.x * cell + cell / 2, oy + food.y * cell + cell / 2, cell * 0.46, 0, 7);
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.beginPath();
        ctx.arc(ox + food.x * cell + cell / 2, oy + food.y * cell + cell / 2, cell * 0.3, 0, 7);
        ctx.fill();

        // 蛇（撞墙那一下头部会越界，跳过不画）
        snake.forEach((s, i) => {
          if (s.x < 0 || s.y < 0 || s.x >= COLS || s.y >= ROWS) return;
          const t = i / Math.max(1, snake.length - 1);
          ctx.fillStyle = i === 0 ? C.ink : `rgba(42,33,27,${0.85 - t * 0.45})`;
          fillRR(
            ctx,
            ox + s.x * cell + 1.5,
            oy + s.y * cell + 1.5,
            cell - 3,
            cell - 3,
            i === 0 ? cell * 0.32 : cell * 0.24,
            ctx.fillStyle
          );
        });
      },
    };
  }

  /* ================================================================
     2. 俄罗斯方块
     ================================================================ */
  function Tetris() {
    const COLS = 10;
    const ROWS = 18;
    let cell = 18;
    const state = { score: 0, over: false, paused: false, label: '', events: [] };

    const SHAPES = [
      [[1, 1, 1, 1]],                       // I
      [[1, 1], [1, 1]],                     // O
      [[0, 1, 0], [1, 1, 1]],               // T
      [[1, 0, 0], [1, 1, 1]],               // J
      [[0, 0, 1], [1, 1, 1]],               // L
      [[0, 1, 1], [1, 1, 0]],               // S
      [[1, 1, 0], [0, 1, 1]],               // Z
    ];
    const COLORS = [C.brand, C.warn, '#8B5CF6', '#3B82F6', C.brand2, C.good, '#E9536F'];

    let board, cur, nextIdx, dropAcc, dropMs, lines;

    function newPiece() {
      const idx = nextIdx;
      nextIdx = rnd(SHAPES.length);
      const shape = SHAPES[idx].map((r) => r.slice());
      return {
        cells: shape,
        color: COLORS[idx],
        x: Math.floor((COLS - shape[0].length) / 2),
        y: 0,
      };
    }

    function reset() {
      board = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
      nextIdx = rnd(SHAPES.length);
      cur = newPiece();
      dropAcc = 0;
      dropMs = 620;
      lines = 0;
      state.score = 0;
      state.over = false;
    }

    function collide(cells, px, py) {
      for (let y = 0; y < cells.length; y++) {
        for (let x = 0; x < cells[y].length; x++) {
          if (!cells[y][x]) continue;
          const bx = px + x;
          const by = py + y;
          if (bx < 0 || bx >= COLS || by >= ROWS) return true;
          if (by >= 0 && board[by][bx]) return true;
        }
      }
      return false;
    }

    function rotate(cells) {
      const h = cells.length;
      const w = cells[0].length;
      const out = Array.from({ length: w }, () => Array(h).fill(0));
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) out[x][h - 1 - y] = cells[y][x];
      }
      return out;
    }

    function lock() {
      cur.cells.forEach((row, y) => row.forEach((v, x) => {
        if (v && cur.y + y >= 0) board[cur.y + y][cur.x + x] = cur.color;
      }));

      // 消行
      let cleared = 0;
      for (let y = ROWS - 1; y >= 0; y--) {
        if (board[y].every((c) => c)) {
          board.splice(y, 1);
          board.unshift(Array(COLS).fill(null));
          cleared++;
          y++;
        }
      }
      if (cleared) {
        lines += cleared;
        state.score += [0, 100, 300, 500, 800][cleared] || 800;
        dropMs = Math.max(150, 620 - lines * 22);
        state.events.push('line');
      }

      cur = newPiece();
      if (collide(cur.cells, cur.x, cur.y)) {
        state.over = true;
        state.events.push('over');
      }
    }

    function move(dx) {
      if (!collide(cur.cells, cur.x + dx, cur.y)) cur.x += dx;
    }

    function softDrop() {
      if (!collide(cur.cells, cur.x, cur.y + 1)) {
        cur.y++;
        state.score += 1;
      } else {
        lock();
      }
    }

    function hardDrop() {
      while (!collide(cur.cells, cur.x, cur.y + 1)) {
        cur.y++;
        state.score += 2;
      }
      state.events.push('drop');
      lock();
    }

    function doRotate() {
      const r = rotate(cur.cells);
      for (const dx of [0, -1, 1, -2, 2]) {
        if (!collide(r, cur.x + dx, cur.y)) {
          cur.cells = r;
          cur.x += dx;
          return;
        }
      }
    }

    reset();

    return {
      state,
      reset,
      resize(w, h) {
        cell = Math.floor(Math.min(w / COLS, (h - 10) / ROWS));
      },
      input(a) {
        if (state.over) return;
        if (a === 'left') move(-1);
        else if (a === 'right') move(1);
        else if (a === 'up' || a === 'a') doRotate();
        else if (a === 'down') softDrop();
        else if (a === 'b') hardDrop();
      },
      update(dt) {
        if (state.over) return;
        dropAcc += dt;
        while (dropAcc >= dropMs) {
          dropAcc -= dropMs;
          if (!collide(cur.cells, cur.x, cur.y + 1)) cur.y++;
          else lock();
          if (state.over) break;
        }
      },
      render(ctx, w, h) {
        const ox = Math.floor((w - COLS * cell) / 2);
        const oy = Math.floor((h - ROWS * cell) / 2);

        ctx.fillStyle = C.bg;
        ctx.fillRect(0, 0, w, h);

        // 边框
        ctx.strokeStyle = C.grid;
        ctx.lineWidth = 2;
        ctx.strokeRect(ox, oy, COLS * cell, ROWS * cell);

        const drawCell = (cx, cy, color) => {
          fillRR(ctx, ox + cx * cell + 1.5, oy + cy * cell + 1.5, cell - 3, cell - 3, 4, color);
        };

        // 已固定的方块
        board.forEach((row, y) => row.forEach((c, x) => {
          if (c) drawCell(x, y, c);
        }));

        // 落点投影
        let ghostY = cur.y;
        while (!collide(cur.cells, cur.x, ghostY + 1)) ghostY++;
        cur.cells.forEach((row, y) => row.forEach((v, x) => {
          if (!v) return;
          ctx.globalAlpha = 0.16;
          drawCell(cur.x + x, ghostY + y, cur.color);
          ctx.globalAlpha = 1;
        }));

        // 当前方块
        cur.cells.forEach((row, y) => row.forEach((v, x) => {
          if (v && cur.y + y >= 0) drawCell(cur.x + x, cur.y + y, cur.color);
        }));
      },
    };
  }

  /* ================================================================
     3. 推箱子
     ================================================================ */
  function Sokoban() {
    const LEVELS = [
      [
        '########',
        '#  .   #',
        '#  $   #',
        '#  @   #',
        '#      #',
        '########',
      ],
      [
        '#########',
        '#   #   #',
        '# $ # . #',
        '#  @    #',
        '# $   . #',
        '#   #   #',
        '#########',
      ],
      [
        '##########',
        '#  ..    #',
        '#  $$    #',
        '#   @    #',
        '#        #',
        '#   ##   #',
        '##########',
      ],
    ];

    let cell = 30;
    let map = [];
    let px = 0;
    let py = 0;
    let level = 0;
    let history = [];
    const state = { score: 0, over: false, paused: false, label: '', events: [] };

    function load(idx) {
      level = idx;
      const src = LEVELS[idx];
      map = src.map((row) => row.split(''));
      history = [];
      for (let y = 0; y < map.length; y++) {
        for (let x = 0; x < map[y].length; x++) {
          if (map[y][x] === '@' || map[y][x] === '+') {
            px = x; py = y;
            map[y][x] = map[y][x] === '+' ? '*' : ' ';
          }
        }
      }
      state.over = false;
      state.label = `第 ${idx + 1} 关 · 共 ${LEVELS.length} 关`;
    }

    function snapshot() {
      history.push({ map: map.map((r) => r.slice()), px, py });
      if (history.length > 60) history.shift();
    }

    function isDone() {
      return !map.some((row) => row.some((c) => c === '$'));
    }

    function walk(dx, dy) {
      if (state.over) return;
      const nx = px + dx;
      const ny = py + dy;
      const target = map[ny] && map[ny][nx];
      if (!target || target === '#') return;

      if (target === '$') {
        const bx = nx + dx;
        const by = ny + dy;
        const beyond = map[by] && map[by][bx];
        if (!beyond || beyond === '#' || beyond === '$' || beyond === '*') return;
        snapshot();
        map[by][bx] = beyond === '.' ? '*' : '$';
        map[ny][nx] = ' ';
        px = nx; py = ny;
        state.events.push('push');
      } else {
        if (target === '*') return; // 箱子落在点上，不能走
        snapshot();
        px = nx; py = ny;
      }

      if (isDone()) {
        state.score += 100;
        state.events.push('win');
        if (level + 1 < LEVELS.length) {
          load(level + 1);
        } else {
          state.over = true;
          state.label = '全部通关';
          state.events.push('over');
        }
      }
    }

    load(0);

    return {
      state,
      reset: () => load(level),
      resize(w, h) {
        const rows = map.length || 6;
        const cols = (map[0] && map[0].length) || 8;
        cell = Math.floor(Math.min((w - 16) / cols, (h - 16) / rows));
      },
      input(a) {
        if (a === 'up') walk(0, -1);
        else if (a === 'down') walk(0, 1);
        else if (a === 'left') walk(-1, 0);
        else if (a === 'right') walk(1, 0);
        else if (a === 'b') load(level);          // 重来本关
        else if (a === 'a' && history.length) {   // 撤销
          const s = history.pop();
          map = s.map;
          px = s.px;
          py = s.py;
        }
      },
      update() {},
      render(ctx, w, h) {
        const rows = map.length;
        const cols = map[0].length;
        const ox = Math.floor((w - cols * cell) / 2);
        const oy = Math.floor((h - rows * cell) / 2);

        ctx.fillStyle = C.bg;
        ctx.fillRect(0, 0, w, h);

        map.forEach((row, y) => row.forEach((c, x) => {
          const gx = ox + x * cell;
          const gy = oy + y * cell;

          if (c === '#') {
            fillRR(ctx, gx + 1, gy + 1, cell - 2, cell - 2, 5, '#6B5C4A');
            return;
          }
          fillRR(ctx, gx + 1, gy + 1, cell - 2, cell - 2, 4, C.darkPanel);

          if (c === '.' || c === '*') {
            ctx.fillStyle = C.brand;
            ctx.beginPath();
            ctx.arc(gx + cell / 2, gy + cell / 2, cell * 0.18, 0, 7);
            ctx.fill();
          }
          if (c === '$' || c === '*') {
            const onGoal = c === '*';
            fillRR(ctx, gx + cell * 0.15, gy + cell * 0.15,
              cell * 0.7, cell * 0.7, 6, onGoal ? C.good : '#C99A5B');
            // 木箱纹理
            ctx.strokeStyle = 'rgba(255,255,255,.5)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(gx + cell * 0.15, gy + cell * 0.15);
            ctx.lineTo(gx + cell * 0.85, gy + cell * 0.85);
            ctx.stroke();
          }
        }));

        // 小人：圆头 + 肩膀 + 两条腿
        const cx = ox + px * cell + cell / 2;
        const cy = oy + py * cell + cell / 2;
        const R = cell * 0.17;
        ctx.fillStyle = C.ink;
        ctx.beginPath();
        ctx.arc(cx, cy - cell * 0.2, R, 0, 7);
        ctx.fill();
        fillRR(ctx, cx - cell * 0.21, cy - cell * 0.02, cell * 0.42, cell * 0.26, cell * 0.1, C.ink);
        fillRR(ctx, cx - cell * 0.15, cy + cell * 0.2, cell * 0.11, cell * 0.14, 2, C.ink);
        fillRR(ctx, cx + cell * 0.04, cy + cell * 0.2, cell * 0.11, cell * 0.14, 2, C.ink);

      },
    };
  }

  /* ================================================================
     4. 飞机大战
     ================================================================ */
  function Shooter() {
    const state = { score: 0, over: false, paused: false, label: '', events: [] };
    let W = 360;
    let H = 560;

    let player, bullets, enemies, eBullets, parts, spawnAcc, shootAcc, hp;

    function reset() {
      player = { x: W / 2, y: H - 70, r: 15 };
      bullets = [];
      enemies = [];
      eBullets = [];
      parts = [];
      spawnAcc = 0;
      shootAcc = 0;
      hp = 3;
      state.score = 0;
      state.over = false;
    }

    function boom(x, y, color) {
      for (let i = 0; i < 10; i++) {
        const a = Math.random() * 7;
        const s = 40 + Math.random() * 120;
        parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 420, color });
      }
    }

    reset();

    return {
      state,
      reset,
      resize(w, h) {
        W = w; H = h;
        if (player) {
          player.x = clamp(player.x, 20, W - 20);
          player.y = H - 70;
        }
      },
      input(a) {
        if (state.over) return;
        const sp = 26;
        if (a === 'left') player.x = clamp(player.x - sp, 18, W - 18);
        else if (a === 'right') player.x = clamp(player.x + sp, 18, W - 18);
        else if (a === 'up') player.y = clamp(player.y - sp, H * 0.45, H - 40);
        else if (a === 'down') player.y = clamp(player.y + sp, H * 0.45, H - 40);
      },
      update(dt) {
        if (state.over) return;
        const k = dt / 16.7;

        shootAcc += dt;
        if (shootAcc > 150) {
          shootAcc = 0;
          bullets.push({ x: player.x, y: player.y - 18 });
          state.events.push('shoot');
        }

        spawnAcc += dt;
        if (spawnAcc > Math.max(320, 900 - state.score * 0.4)) {
          spawnAcc = 0;
          enemies.push({
            x: 24 + Math.random() * (W - 48),
            y: -30,
            r: 16,
            vy: 1.4 + Math.random() * 1.3 + state.score * 0.0006,
            fireAcc: Math.random() * 900,
            hp: 1 + (Math.random() < 0.15 ? 1 : 0),
          });
        }

        bullets.forEach((b) => { b.y -= 7.5 * k; });
        bullets = bullets.filter((b) => b.y > -20);

        eBullets.forEach((b) => { b.y += 4.2 * k; });
        eBullets = eBullets.filter((b) => b.y < H + 20);

        enemies.forEach((e) => {
          e.y += e.vy * k;
          e.fireAcc += dt;
          if (e.fireAcc > 1400 && e.y > 0) {
            e.fireAcc = 0;
            eBullets.push({ x: e.x, y: e.y + 14 });
          }
        });

        // 子弹命中敌人
        for (let i = enemies.length - 1; i >= 0; i--) {
          const e = enemies[i];
          for (let j = bullets.length - 1; j >= 0; j--) {
            const b = bullets[j];
            if (Math.abs(b.x - e.x) < e.r && Math.abs(b.y - e.y) < e.r) {
              bullets.splice(j, 1);
              e.hp--;
              if (e.hp <= 0) {
                boom(e.x, e.y, C.brand);
                enemies.splice(i, 1);
                state.score += 10;
                state.events.push('boom');
              } else {
                state.events.push('hit');
              }
              break;
            }
          }
        }

        // 敌人撞玩家
        enemies.forEach((e) => {
          if (Math.abs(e.x - player.x) < e.r + 10 && Math.abs(e.y - player.y) < e.r + 12) {
            boom(e.x, e.y, C.warn);
            e.y = H + 100;
            hp--;
            state.events.push('hurt');
          }
        });
        enemies = enemies.filter((e) => e.y < H + 40);

        // 敌弹命中玩家
        for (let i = eBullets.length - 1; i >= 0; i--) {
          const b = eBullets[i];
          if (Math.abs(b.x - player.x) < 12 && Math.abs(b.y - player.y) < 14) {
            eBullets.splice(i, 1);
            boom(player.x, player.y, C.brand2);
            hp--;
            state.events.push('hurt');
          }
        }

        parts.forEach((p) => {
          p.x += p.vx * (dt / 1000);
          p.y += p.vy * (dt / 1000);
          p.life -= dt;
        });
        parts = parts.filter((p) => p.life > 0);

        if (hp <= 0) {
          state.over = true;
          state.events.push('over');
        }
        state.label = `生命 ${Math.max(0, hp)} / 3`;
      },
      render(ctx, w, h) {
        ctx.fillStyle = '#1E1A16';
        ctx.fillRect(0, 0, w, h);

        // 星空
        for (let i = 0; i < 26; i++) {
          const y = ((i * 97 + (performance.now() * 0.03)) % h);
          ctx.fillStyle = i % 3 ? 'rgba(255,255,255,.18)' : 'rgba(255,255,255,.4)';
          ctx.fillRect((i * 53) % w, y, 2, 2);
        }

        // 玩家飞机
        ctx.save();
        ctx.translate(player.x, player.y);
        // 机身
        ctx.fillStyle = C.brand;
        ctx.beginPath();
        ctx.moveTo(0, -20);
        ctx.quadraticCurveTo(5, -10, 5, 4);
        ctx.lineTo(5, 13);
        ctx.lineTo(-5, 13);
        ctx.lineTo(-5, 4);
        ctx.quadraticCurveTo(-5, -10, 0, -20);
        ctx.closePath();
        ctx.fill();
        // 后掠翼
        ctx.fillStyle = C.brand2;
        ctx.beginPath();
        ctx.moveTo(-4, -2);
        ctx.lineTo(-17, 11);
        ctx.lineTo(-16, 14);
        ctx.lineTo(-4, 10);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(4, -2);
        ctx.lineTo(17, 11);
        ctx.lineTo(16, 14);
        ctx.lineTo(4, 10);
        ctx.closePath();
        ctx.fill();
        // 尾翼
        ctx.beginPath();
        ctx.moveTo(-3, 10);
        ctx.lineTo(-8, 15);
        ctx.lineTo(8, 15);
        ctx.lineTo(3, 10);
        ctx.closePath();
        ctx.fill();
        // 座舱
        ctx.fillStyle = 'rgba(255,255,255,.75)';
        ctx.beginPath();
        ctx.ellipse(0, -6, 2.6, 5, 0, 0, 7);
        ctx.fill();
        ctx.restore();

        // 我方子弹
        bullets.forEach((b) => {
          fillRR(ctx, b.x - 2, b.y - 8, 4, 12, 2, '#FFD9C2');
        });

        // 敌机
        enemies.forEach((e) => {
          ctx.fillStyle = e.hp > 1 ? '#8B5CF6' : '#7BC96F';
          ctx.beginPath();
          ctx.moveTo(e.x, e.y + 15);
          ctx.lineTo(e.x + 14, e.y - 10);
          ctx.lineTo(e.x, e.y - 4);
          ctx.lineTo(e.x - 14, e.y - 10);
          ctx.closePath();
          ctx.fill();
        });

        // 敌弹
        eBullets.forEach((b) => {
          ctx.fillStyle = '#FF6B6B';
          ctx.beginPath();
          ctx.arc(b.x, b.y, 3.4, 0, 7);
          ctx.fill();
        });

        // 爆炸粒子
        parts.forEach((p) => {
          ctx.globalAlpha = Math.max(0, p.life / 420);
          ctx.fillStyle = p.color;
          ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
          ctx.globalAlpha = 1;
        });
      },
    };
  }

  /* ================================================================
     5. 坦克大战
     ================================================================ */
  function Tank() {
    const state = { score: 0, over: false, paused: false, label: '', events: [] };

    // 战场固定 13×20 逻辑格，格子按画布自适应、整体居中——
    // 手机上墙不会再缩在左上角（旧版固定 36px 且 resize 不重排）
    const COLS = 13;
    const ROWS = 20;

    let W = 360;
    let H = 560;
    let cell = 27;
    let ox = 0;
    let oy = 0;
    let T = 25;

    let player, enemies, bullets, walls, parts, spawnAcc, hp, baseAlive;

    const bfLeft = () => ox;
    const bfTop = () => oy;
    const bfRight = () => ox + COLS * cell;
    const bfBottom = () => oy + ROWS * cell;
    const bfCX = () => ox + (COLS * cell) / 2;
    const wallCX = (w) => ox + w.cx * cell + cell / 2;
    const wallCY = (w) => oy + w.cy * cell + cell / 2;

    function layout() {
      cell = Math.min(W / COLS, H / ROWS);
      ox = (W - COLS * cell) / 2;
      oy = (H - ROWS * cell) / 2;
      T = cell * 0.92;
    }

    function buildWalls() {
      walls = [];
      const put = (cx, cy, hp) => {
        if (cx < 1 || cx > COLS - 2 || cy < 1 || cy > ROWS - 3) return;
        walls.push({ cx, cy, hp: hp || 2 });
      };

      const left = 2;
      const right = COLS - 3;
      [3, 4, 8, 9].forEach((cy) => { put(left, cy); put(right, cy); });
      [4, 5, 9, 10].forEach((cy) => { put(left + 1, cy); put(right - 1, cy); });

      const mid = Math.floor(COLS / 2);
      [5, 6].forEach((cx) => { put(cx, 6); put(COLS - 1 - cx, 6); });
      put(mid, 7);
      put(mid, 11);
      put(mid - 1, 11);
      put(mid + 1, 11);

      const baseCol = Math.floor(COLS / 2);
      put(baseCol - 2, ROWS - 4, 3);
      put(baseCol + 2, ROWS - 4, 3);
      put(baseCol - 1, ROWS - 3, 3);
      put(baseCol + 1, ROWS - 3, 3);
    }

    function boom(x, y, color) {
      for (let i = 0; i < 8; i++) {
        const a = Math.random() * 6.28;
        const s = cell * (2 + Math.random() * 4);
        parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 380, color });
      }
    }

    function reset() {
      layout();
      player = { x: bfCX(), y: bfBottom() - cell * 1.4, dir: 0, cool: 0 };
      enemies = [];
      bullets = [];
      parts = [];
      hp = 3;
      baseAlive = true;
      spawnAcc = 0;
      state.score = 0;
      state.over = false;
      buildWalls();
    }

    function shoot() {
      if (player.cool > 0) return;
      player.cool = 260;
      const d = DIRS[player.dir];
      bullets.push({
        x: player.x + d.x * T * 0.55,
        y: player.y + d.y * T * 0.55,
        vx: d.x, vy: d.y, mine: true,
      });
      state.events.push('shoot');
    }

    function enemyShoot(e) {
      const d = DIRS[e.dir];
      bullets.push({
        x: e.x + d.x * T * 0.55,
        y: e.y + d.y * T * 0.55,
        vx: d.x, vy: d.y, mine: false,
      });
    }

    function hitWall(x, y) {
      return walls.some((w) => Math.abs(wallCX(w) - x) < cell * 0.72 &&
        Math.abs(wallCY(w) - y) < cell * 0.72);
    }

    const DIRS = [
      { x: 0, y: -1 }, { x: 1, y: 0 }, { x: 0, y: 1 }, { x: -1, y: 0 },
    ];

    reset();

    return {
      state,
      reset,
      resize(w, h) {
        W = w; H = h;
        layout();
        const half = T / 2;
        player.x = clamp(player.x, bfLeft() + half, bfRight() - half);
        player.y = clamp(player.y, bfTop() + T, bfBottom() - half);
        enemies.forEach((e) => {
          e.x = clamp(e.x, bfLeft() + half, bfRight() - half);
          e.y = clamp(e.y, bfTop() + half, bfBottom() - T);
        });
        bullets = bullets.filter((b) =>
          b.x > bfLeft() && b.x < bfRight() && b.y > bfTop() && b.y < bfBottom());
      },
      input(a) {
        if (state.over) return;
        const step = cell * 0.62;
        if (a === 'up') { player.dir = 0; player.y = Math.max(bfTop() + T / 2, player.y - step); }
        else if (a === 'right') { player.dir = 1; player.x = Math.min(bfRight() - T / 2, player.x + step); }
        else if (a === 'down') { player.dir = 2; player.y = Math.min(bfBottom() - T / 2, player.y + step); }
        else if (a === 'left') { player.dir = 3; player.x = Math.max(bfLeft() + T / 2, player.x - step); }
        else if (a === 'a' || a === 'b') shoot();
      },
      update(dt) {
        if (state.over) return;
        const k = dt / 16.7;
        const espd = cell * 0.043 * k;
        const bspd = cell * 0.18 * k;
        player.cool = Math.max(0, player.cool - dt);

        spawnAcc += dt;
        if (spawnAcc > Math.max(900, 2000 - state.score * 3) && enemies.length < 5) {
          spawnAcc = 0;
          let ex = bfLeft() + cell * 1.5;
          for (let t = 0; t < 16; t++) {
            const cand = bfLeft() + cell + Math.random() * (COLS * cell - cell * 2);
            const tooClose = enemies.some((o) => Math.abs(o.x - cand) < T * 1.3);
            if (!hitWall(cand, bfTop() + cell * 0.7) && !tooClose) { ex = cand; break; }
          }
          enemies.push({
            x: ex,
            y: bfTop() + cell * 0.6,
            dir: 2,
            hp: Math.random() < 0.25 ? 2 : 1,
          });
        }

        enemies.forEach((e) => {
          if (Math.random() < dt / 700) e.dir = Math.floor(Math.random() * 4);
          const d = DIRS[e.dir];
          const nx = e.x + d.x * espd;
          const ny = e.y + d.y * espd;
          if (nx > bfLeft() + T / 2 && nx < bfRight() - T / 2 &&
            ny > bfTop() + T / 2 && ny < bfBottom() - T && !hitWall(nx, ny)) {
            e.x = nx;
            e.y = ny;
          } else {
            e.dir = Math.floor(Math.random() * 4);
          }

          if (Math.random() < dt / 1500) enemyShoot(e);
        });

        bullets.forEach((b) => {
          b.x += b.vx * bspd;
          b.y += b.vy * bspd;
        });

        // 子弹打墙
        bullets.forEach((b) => {
          for (let i = walls.length - 1; i >= 0; i--) {
            const w = walls[i];
            if (b.x > ox + w.cx * cell && b.x < ox + (w.cx + 1) * cell &&
              b.y > oy + w.cy * cell && b.y < oy + (w.cy + 1) * cell) {
              w.hp--;
              b.dead = true;
              boom(b.x, b.y, '#B08958');
              if (w.hp <= 0) walls.splice(i, 1);
              break;
            }
          }
        });

        // 我方子弹打敌人
        bullets.filter((b) => b.mine && !b.dead).forEach((b) => {
          for (let i = enemies.length - 1; i >= 0; i--) {
            const e = enemies[i];
            if (Math.abs(b.x - e.x) < T * 0.7 && Math.abs(b.y - e.y) < T * 0.7) {
              b.dead = true;
              e.hp--;
              if (e.hp <= 0) {
                enemies.splice(i, 1);
                state.score += 20;
                boom(e.x, e.y, C.brand);
                state.events.push('boom');
              } else {
                state.events.push('hit');
              }
              break;
            }
          }
        });

        // 敌弹打玩家
        bullets.filter((b) => !b.mine && !b.dead).forEach((b) => {
          if (Math.abs(b.x - player.x) < T * 0.6 && Math.abs(b.y - player.y) < T * 0.6) {
            b.dead = true;
            hp--;
            player.x = bfCX();
            player.y = bfBottom() - cell * 1.4;
            boom(player.x, player.y, C.brand2);
            state.events.push('hurt');
          }
        });

        // 敌人撞玩家
        enemies.forEach((e) => {
          if (Math.abs(e.x - player.x) < T && Math.abs(e.y - player.y) < T) {
            hp--;
            e.hp = 0;
            boom(e.x, e.y, C.warn);
            state.events.push('hurt');
          }
        });
        enemies = enemies.filter((e) => e.hp > 0);

        parts.forEach((p) => {
          p.x += p.vx * (dt / 1000);
          p.y += p.vy * (dt / 1000);
          p.life -= dt;
        });
        parts = parts.filter((p) => p.life > 0);

        bullets = bullets.filter((b) => !b.dead &&
          b.x > bfLeft() - 10 && b.x < bfRight() + 10 &&
          b.y > bfTop() - 10 && b.y < bfBottom() + 10);

        if (hp <= 0 || !baseAlive) {
          state.over = true;
          state.events.push('over');
        }
        state.label = `生命 ${Math.max(0, hp)} / 3`;
      },
      render(ctx, w, h) {
        ctx.fillStyle = C.bg;
        ctx.fillRect(0, 0, w, h);

        // 战场地面 + 边框
        fillRR(ctx, bfLeft(), bfTop(), COLS * cell, ROWS * cell, 8, C.darkPanel);
        ctx.strokeStyle = C.grid;
        ctx.lineWidth = 1;
        for (let i = 1; i < COLS; i++) {
          ctx.beginPath();
          ctx.moveTo(bfLeft() + i * cell, bfTop());
          ctx.lineTo(bfLeft() + i * cell, bfBottom());
          ctx.stroke();
        }
        for (let j = 1; j < ROWS; j++) {
          ctx.beginPath();
          ctx.moveTo(bfLeft(), bfTop() + j * cell);
          ctx.lineTo(bfRight(), bfTop() + j * cell);
          ctx.stroke();
        }

        // 砖墙
        walls.forEach((wl) => {
          const x = ox + wl.cx * cell;
          const y = oy + wl.cy * cell;
          fillRR(ctx, x + 1, y + 1, cell - 2, cell - 2, 3,
            wl.hp >= 3 ? '#8A6A45' : '#B08958');
          ctx.strokeStyle = 'rgba(0,0,0,.25)';
          ctx.beginPath();
          ctx.moveTo(x + 1, y + cell / 2);
          ctx.lineTo(x + cell - 1, y + cell / 2);
          ctx.stroke();
        });

        // 基地
        const bw = cell * 1.1;
        const bh = cell * 0.8;
        ctx.fillStyle = baseAlive ? '#8A6A2F' : '#4A4038';
        rr(ctx, bfCX() - bw / 2, bfBottom() - bh - 4, bw, bh, 5);
        ctx.fill();
        ctx.fillStyle = baseAlive ? C.warn : '#6B5F55';
        rr(ctx, bfCX() - bw / 2 + 4, bfBottom() - bh, bw - 8, bh - 8, 3);
        ctx.fill();

        const drawTank = (x, y, dir, color, size) => {
          ctx.save();
          ctx.translate(x, y);
          ctx.rotate((dir * Math.PI) / 2);
          ctx.fillStyle = 'rgba(0,0,0,.4)';
          rr(ctx, -size * 0.5, -size * 0.38, size * 0.14, size * 0.76, 2);
          ctx.fill();
          rr(ctx, size * 0.36, -size * 0.38, size * 0.14, size * 0.76, 2);
          ctx.fill();
          ctx.fillStyle = color;
          rr(ctx, -size * 0.42, -size * 0.42, size * 0.84, size * 0.84, 4);
          ctx.fill();
          ctx.fillStyle = 'rgba(0,0,0,.45)';
          rr(ctx, -size * 0.09, -size * 0.72, size * 0.18, size * 0.5, 2);
          ctx.fill();
          ctx.restore();
        };

        drawTank(player.x, player.y, player.dir, C.brand, T);
        enemies.forEach((e) => drawTank(e.x, e.y, e.dir, e.hp > 1 ? '#8B5CF6' : '#7BC96F', T));

        bullets.forEach((b) => {
          ctx.fillStyle = b.mine ? '#FFD9C2' : '#FF6B6B';
          ctx.beginPath();
          ctx.arc(b.x, b.y, cell * 0.1, 0, 7);
          ctx.fill();
        });

        parts.forEach((p) => {
          ctx.globalAlpha = Math.max(0, p.life / 380);
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, cell * 0.09, 0, 7);
          ctx.fill();
          ctx.globalAlpha = 1;
        });
      },
    };
  }

  /* ================================================================
     6. 跳一跳
     按住蓄力、松开起跳，复刻微信小程序那版。
     摔倒可以无限复活：分数保留，角色回到当前方块中心接着跳。
     ================================================================ */
  function Jump() {
    const state = { score: 0, over: false, paused: false, label: '', events: [] };
    const COLORS = ['#6E5B4B', '#5C6B57', '#6B565C', '#4F6170', '#7A6448'];

    let W = 0;
    let H = 0;
    let groundY = 0;
    let unit = 0;

    let blocks = [];
    let cur = 0;

    let px = 0;
    let py = 0;

    let charging = false;
    let power = 0;

    let jumping = false;
    let jElapsed = 0;
    let jDur = 380;
    let jFrom = 0;
    let jTo = 0;
    let jPeak = 0;

    let falling = false;
    let fallSpeed = 0;

    let camX = 0;
    let camTarget = 0;
    let labelTtl = 0;

    function spawnNext() {
      const last = blocks[blocks.length - 1];
      const gap = unit * (8 + Math.random() * 14);
      const bw = unit * (14 + Math.random() * 12);
      blocks.push({
        x: last.x + last.w + gap,
        w: bw,
        color: COLORS[blocks.length % COLORS.length],
      });
    }

    function buildWorld() {
      blocks = [];
      const firstW = unit * 26;
      const firstX = unit * 10;
      blocks.push({ x: firstX, w: firstW, color: COLORS[0] });
      spawnNext();
      cur = 0;
      px = firstX + firstW / 2;
      py = groundY;
      camX = 0;
      camTarget = 0;
    }

    function reset() {
      state.score = 0;
      state.over = false;
      state.label = '';
      state.events.length = 0;
      charging = false;
      power = 0;
      jumping = false;
      falling = false;
      fallSpeed = 0;
      jElapsed = 0;
      labelTtl = 0;
      camX = 0;
      camTarget = 0;
      blocks = [];
      if (unit > 0) buildWorld();
    }

    function startJump() {
      // 最短也要跳出脚下这块方块（最宽的方块半宽 13u），否则轻点一下就原地摔死
      const dist = unit * (16 + power * 32);
      jFrom = px;
      jTo = px + dist;
      jElapsed = 0;
      jDur = 330 + power * 170;
      jPeak = unit * (11 + power * 7);
      jumping = true;
      charging = false;
      power = 0;
      state.label = '';
      labelTtl = 0;
      state.events.push('drop');
    }

    function land() {
      let idx = -1;
      for (let i = 0; i < blocks.length; i++) {
        const b = blocks[i];
        if (px >= b.x && px <= b.x + b.w) { idx = i; break; }
      }
      // 没踩到下一块：跳短了或者跳过头
      if (idx <= cur) {
        falling = true;
        fallSpeed = unit * 0.06;
        state.label = '';
        state.events.push('hurt');
        return;
      }

      cur = idx;
      const b = blocks[idx];
      const off = Math.abs(px - (b.x + b.w / 2));
      if (off < unit * 2.2) {
        state.score += 2;
        state.label = '正中中心 +2';
        state.events.push('line');
      } else {
        state.score += 1;
        state.label = '+1';
        state.events.push('eat');
      }
      labelTtl = 900;

      spawnNext();
      camTarget = Math.max(0, px - W * 0.34);
    }

    reset();

    return {
      state,
      // 蓄力语义靠 press/release，宿主不要连发
      holdRepeat: false,
      reset,
      resize(w, h) {
        if (w <= 0 || h <= 0) return;
        W = w;
        H = h;
        groundY = H * 0.62;
        unit = W / 100;
        if (!blocks.length) reset();
      },
      press(a) {
        if (a !== 'a') return;
        if (state.over || jumping || falling || charging) return;
        charging = true;
        power = 0;
        labelTtl = 0;
      },
      release(a) {
        if (a !== 'a' || !charging) return;
        startJump();
      },
      input() {},
      canRevive() {
        return state.over;
      },
      revive() {
        state.over = false;
        state.events.length = 0;
        falling = false;
        jumping = false;
        charging = false;
        power = 0;
        fallSpeed = 0;
        jElapsed = 0;
        state.label = '';
        labelTtl = 0;

        const b = blocks[cur];
        if (!b) return;
        px = b.x + b.w / 2;
        py = groundY;
        camTarget = Math.max(0, px - W * 0.34);
        camX = camTarget;
        if (blocks.length <= cur + 1) spawnNext();
      },
      update(dt) {
        if (state.over || unit <= 0) return;

        camX += (camTarget - camX) * Math.min(1, dt / 110);
        if (labelTtl > 0) {
          labelTtl -= dt;
          if (labelTtl <= 0) state.label = '';
        }

        if (falling) {
          fallSpeed += dt * 0.0026;
          py += fallSpeed * dt;
          if (py > H + unit * 16) {
            state.over = true;
            state.events.push('over');
          }
          return;
        }

        if (charging) {
          power = Math.min(1, power + dt * 0.0017);
          state.label = '蓄力 ' + Math.round(power * 100) + '%';
          return;
        }

        if (jumping) {
          jElapsed += dt;
          const t = Math.max(0, Math.min(1, jElapsed / jDur));
          px = jFrom + (jTo - jFrom) * t;
          py = groundY - Math.sin(t * Math.PI) * jPeak;
          if (t >= 1) {
            py = groundY;
            jumping = false;
            land();
          }
        }
      },
      render(ctx, w, h) {
        ctx.fillStyle = C.bg;
        ctx.fillRect(0, 0, w, h);
        if (unit <= 0) return;

        // 远景地平线
        const horizon = groundY + (h - groundY) * 0.62;
        ctx.strokeStyle = C.grid;
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(0, horizon);
        ctx.lineTo(w, horizon);
        ctx.stroke();

        // 方块
        const bh = h - groundY;
        blocks.forEach((b) => {
          const sx = b.x - camX;
          if (sx > w + unit * 26 || sx + b.w < -unit * 26) return;
          fillRR(ctx, sx, groundY, b.w, bh, unit * 2.6, b.color);
          ctx.globalAlpha = 0.16;
          fillRR(ctx, sx, groundY, b.w, unit * 2.2, unit * 1.6, C.light);
          ctx.globalAlpha = 1;
        });

        // 影子
        if (!falling) {
          ctx.globalAlpha = 0.3;
          ctx.fillStyle = '#000';
          ctx.beginPath();
          ctx.ellipse(px - camX, groundY + unit * 1.4, unit * 3.2, unit * 0.9, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1;
        }

        // 角色：蓄力时压扁变宽
        const squash = charging ? power : 0;
        const bodyW = unit * 7 * (1 + squash * 0.34);
        const bodyH = unit * 12 * (1 - squash * 0.36);
        const sx2 = px - camX;
        fillRR(ctx, sx2 - bodyW / 2, py - bodyH, bodyW, bodyH, unit * 2.4, C.light);
        ctx.fillStyle = C.brand2;
        ctx.beginPath();
        ctx.arc(sx2, py - bodyH - unit * 1.4, unit * 2.8 * (1 - squash * 0.2), 0, Math.PI * 2);
        ctx.fill();

        // 蓄力条
        if (charging) {
          const barW = w * 0.56;
          const barX = (w - barW) / 2;
          const barY = h - unit * 13;
          fillRR(ctx, barX, barY, barW, unit * 3, unit * 1.5, C.darkPanel);
          if (power > 0.01) {
            fillRR(ctx, barX, barY, barW * power, unit * 3, unit * 1.5, C.brand);
          }
        }
      },
    };
  }

const DB_NAME = 'zuocai-web';
const DB_VER = 1;
let _db = null;

function openDb() {
  if (_db) return Promise.resolve(_db);
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains('recipes')) db.createObjectStore('recipes', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('images')) db.createObjectStore('images');
    };
    req.onsuccess = () => { _db = req.result; resolve(_db); };
    req.onerror = () => reject(req.error);
  });
}

function tx(store, mode) {
  return openDb().then((db) => db.transaction(store, mode).objectStore(store));
}

function reqToPromise(request) {
  return new Promise((resolve, reject) => {
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

const dbAll = () => tx('recipes', 'readonly').then((s) => reqToPromise(s.getAll()));
const dbGet = (id) => tx('recipes', 'readonly').then((s) => reqToPromise(s.get(id)));
const dbPut = (r) => tx('recipes', 'readwrite').then((s) => reqToPromise(s.put(r)));
const dbDel = (id) => tx('recipes', 'readwrite').then((s) => reqToPromise(s.delete(id)));
const imgGet = (k) => tx('images', 'readonly').then((s) => reqToPromise(s.get(k)));
const imgPut = (k, b) => tx('images', 'readwrite').then((s) => reqToPromise(s.put(b, k)));

// ---------------------------------------------------------------- 图片

const urlCache = new Map();

/**
 * 丢掉一张图的缓存。
 *
 * 必须连 Blob URL 一起 revoke：只 delete key 的话，那张图的数据会一直挂在内存里，
 * 换封面几十次之后页面就明显变卡了。
 */
function dropUrl(key) {
  if (!key) return;
  const url = urlCache.get(key);
  if (url) URL.revokeObjectURL(url);
  urlCache.delete(key);
}

async function imageUrl(key) {
  if (!key) return null;
  // 内置封面是静态文件，直接当相对路径用，不进 IndexedDB
  if (key.indexOf('covers/') === 0) return key;
  if (urlCache.has(key)) return urlCache.get(key);
  const blob = await imgGet(key);
  if (!blob) return null;
  const url = URL.createObjectURL(blob);
  urlCache.set(key, url);
  return url;
}

function compressImage(file, maxEdge = 1600, quality = 0.88) {
  return new Promise((resolve, reject) => {
    const src = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxEdge / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.max(1, Math.round(img.naturalWidth * scale));
      const h = Math.max(1, Math.round(img.naturalHeight * scale));
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      canvas.toBlob((blob) => {
        URL.revokeObjectURL(src);
        blob ? resolve(blob) : reject(new Error('compress failed'));
      }, 'image/jpeg', quality);
    };
    img.onerror = () => { URL.revokeObjectURL(src); reject(new Error('decode failed')); };
    img.src = src;
  });
}

async function storeImage(file) {
  const blob = await compressImage(file);
  return storeBlob(blob);
}

async function storeBlob(blob) {
  const key = 'img_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
  await imgPut(key, blob);
  return key;
}

async function hydrateImages(scope) {
  const nodes = [...scope.querySelectorAll('[data-img]')];
  for (const el of nodes) {
    const key = el.getAttribute('data-img');
    if (!key) continue;
    const url = await imageUrl(key);
    if (url && el.getAttribute('data-img') === key) {
      el.src = url;
      el.style.display = 'block';
      const ph = el.parentElement.querySelector('.ph');
      if (ph) ph.style.display = 'none';
    }
  }
}

async function detectProxy() {
  if (!/^https?:$/.test(location.protocol)) return;
  try {
    const r = await fetch('/api/status', { cache: 'no-store' });
    if (!r.ok) return;
    const j = await r.json();

      proxy.on = true;
      proxy.configured = !!j.configured;
      proxy.model = j.model || '';
      proxy.baseUrl = j.baseUrl || '';

  } catch {

}

const esc = (s) =>

const $ = (sel, scope = document) => scope.querySelector(sel);
const $$ = (sel, scope = document) => [...scope.querySelectorAll(sel)];

function toast(msg) {
  const old = $('.toast');

  const el = document.createElement('div');

  phone.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => {

}

function dialog({ title, message, actions, custom }) {

        mask.remove();

}

// ---------------------------------------------------------------- 查询

function queryRecipes() {
  let list = state.recipes.slice();
  const words = searchWords();

  // 每个词都要在 菜名/描述/食材 之一出现（空格 = AND）
  if (words.length) {
    list = list.filter((r) => {
      const name = (r.name || '').toLowerCase();
      const desc = (r.description || '').toLowerCase();
      const ings = (r.ingredients || []).map((i) => i.n || '').join(' ').toLowerCase();
      return words.every((w) => name.includes(w) || desc.includes(w) || ings.includes(w));
    });

    // 相关度：菜名 2 分、描述 1 分，多词求和；命中食材不计分。
    // 不然搜「土豆」时腊肉焖饭（食材命中）可能排在土豆炒肉前面，看起来像搜错了。
    const rel = (r) => {
      const name = (r.name || '').toLowerCase();
      const desc = (r.description || '').toLowerCase();
      return words.reduce((s, w) =>
        s + (name.includes(w) ? 2 : desc.includes(w) ? 1 : 0), 0);
    };

    list.sort((a, b) => rel(b) - rel(a) || sortCmp(a, b));
  } else {
    list.sort(sortCmp);
  }
  return list;
}

/** 用户选的排序方式（相关度排在它前面，只在有搜索词时生效） */
function sortCmp(a, b) {
  // 常做的菜永远置顶，不受排序方式影响
  const pin = (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0);
  if (pin) return pin;
  if (state.sort === 'name') {
    return a.name.localeCompare(b.name, 'zh-Hans-CN');
  }
  if (state.sort === 'usage') {
    // 打开次数 + 搜索命中次数，热度相同的再按最近更新
    const heat = (r) => (r.openCount || 0) + (r.searchCount || 0);
    return heat(b) - heat(a) || (b.updatedAt || 0) - (a.updatedAt || 0) || b.id - a.id;
  }
  return (b.updatedAt || 0) - (a.updatedAt || 0) || b.id - a.id;
}

/** 使用量 +1：直接改内存对象，排序立刻生效，落库异步进行 */
function bumpUsage(recipe, field) {
  if (!recipe) return;
  recipe[field] = (recipe[field] || 0) + 1;
  dbPut(recipe).catch(() => {});
}

/** 搜索命中：菜名匹配的菜谱各 +1，同一个关键词只记一次 */
function countSearchHits(keyword) {
  const kw = (keyword || '').trim().toLowerCase();
  if (kw.length < 2) return;
  if (kw === state.lastCountedKw) return;
  state.lastCountedKw = kw;
  for (const r of state.recipes) {
    if (!(r.name || '').toLowerCase().includes(kw)) continue;
    r.searchCount = (r.searchCount || 0) + 1;
    dbPut(r).catch(() => {});
  }
}

/** 搜索词数组，多处要用（过滤、相关度、高亮、命中原因） */
function searchWords() {
  return state.keyword.trim().toLowerCase().split(/\s+/).filter(Boolean);

/** 命中片段标成品牌色 */
function highlight(text, words) {
  if (!words.length || !text) return esc(text);
  let out = esc(text);
  for (const w of words) {
    const e = esc(w).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    out = out.replace(new RegExp(`(${e})`, 'gi'), '<mark>$1</mark>');
  }
  return out;
}

  if (!nameHit) {
    const ing = (r.ingredients || []).find((i) =>
      words.some((w) => ((i.n || '') + ' ' + (i.a || '')).toLowerCase().includes(w)));

// ------------------------------------------------ 游戏反馈：音效 + 震动

// 音效用 WebAudio 现场合成，不加载任何音频文件；震动用 navigator.vibrate。
// 事件名与 Android 端 Game.drainEvents 的约定一致。
const GameAudio = (() => {
  let actx = null;
  function ctx() {
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) actx = new AC();
    }
    if (actx && actx.state === 'suspended') actx.resume();
    return actx;
  }
  function tone(freq, dur, type, vol, slideTo) {
    const a = ctx();
    if (!a) return;
    const o = a.createOscillator();
    const g = a.createGain();
    o.type = type || 'triangle';
    o.frequency.setValueAtTime(freq, a.currentTime);
    if (slideTo) o.frequency.linearRampToValueAtTime(slideTo, a.currentTime + dur);
    g.gain.setValueAtTime(vol, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
    o.connect(g).connect(a.destination);
    o.start();
    o.stop(a.currentTime + dur);
  }
  function noise(dur, vol) {
    const a = ctx();
    if (!a) return;
    const len = Math.floor(a.sampleRate * dur);
    const buf = a.createBuffer(1, len, a.sampleRate);
    const d = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) {
      last = last * 0.72 + (Math.random() * 2 - 1) * 0.28;
      d[i] = last;
    }
    const src = a.createBufferSource();
    const g = a.createGain();
    g.gain.setValueAtTime(vol, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
    src.buffer = buf;
    src.connect(g).connect(a.destination);
    src.start();
  }
  const table = {
    shoot: () => tone(880, 0.07, 'square', 0.08, 380),
    hit: () => { noise(0.06, 0.12); tone(500, 0.06, 'triangle', 0.14, 700); },
    boom: () => { tone(160, 0.42, 'triangle', 0.3, 60); noise(0.4, 0.3); },
    hurt: () => { tone(320, 0.09, 'square', 0.2, 0); setTimeout(() => tone(220, 0.13, 'square', 0.2, 0), 90); },
    eat: () => { tone(660, 0.055, 'triangle', 0.2, 0); setTimeout(() => tone(990, 0.075, 'triangle', 0.2, 0), 55); },
    line: () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, 0.09, 'triangle', 0.22, 0), i * 60)),
    drop: () => { tone(200, 0.11, 'triangle', 0.25, 110); noise(0.09, 0.2); },
    push: () => { noise(0.07, 0.15); tone(240, 0.07, 'triangle', 0.18, 300); },
    win: () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, 0.09, 'triangle', 0.24, 0), i * 90)),
    over: () => [523, 392, 262].forEach((f, i) => setTimeout(() => tone(f, 0.16, 'triangle', 0.24, 0), i * 160)),
  };
  return { play(name) { try { (table[name] || (() => {}))(); } catch { /* 忽略 */ } } };
})();

function buzz(pattern) {
  try { if (navigator.vibrate) navigator.vibrate(pattern); } catch { /* 忽略 */ }
}

// 事件 → 音效 + 震动强度
const GAME_FX = {
  shoot: null, hit: null, eat: null, line: null, win: null,
  boom: 32, hurt: 48, drop: 20, push: 16, over: [40, 70, 40, 70, 90],
};

function playGameEvents(events) {
  if (!events || !events.length) return;
  for (const name of events) {
    GameAudio.play(name);
    const v = GAME_FX[name];
    if (v) buzz(v);
  }
}

let gameRaf = null;
let gameInst = null;
let gameKey = null;
/** 离开游戏页要摘掉的键盘/尺寸监听 */
let gameCleanup = null;
/** 重新拉起主循环（复活用） */
let gameStartLoop = null;

function stopGame() {
  if (gameRaf) cancelAnimationFrame(gameRaf);
  gameRaf = null;
  gameInst = null;
  gameStartLoop = null;
  // 以前只在「返回列表」那条路径摘监听，点「再来一局」会再挂一份，
  // 结果是第二局里每按一次键动作执行两次
  if (gameCleanup) {
    gameCleanup();
    gameCleanup = null;
  }
}

function openGame(key) {
  const meta = window.Games.META.find((g) => g.key === key);
  if (!meta) return;
  phone.querySelectorAll('.mask').forEach((m) => m.remove());
  stopGame();

  gameKey = key;
  root.innerHTML = `
  <div class="view enter-right game-view">
    <div class="game-top">
      <button class="icon-btn" id="gameBack" aria-label="返回">${svg('back', 21)}</button>
      <div class="game-head">
        <div class="game-title">${meta.name}</div>
        <div class="game-sub" id="gameLabel">${meta.hint}</div>
      </div>
      <div class="game-score pill"><span>本局</span><b id="gameScore">0</b></div>
      <div class="game-score pill ghost"><span>最高</span><b id="gameBest">0</b></div>
    </div>

    <div class="game-stage" id="gameStage">
      <canvas id="gameCanvas"></canvas>
    </div>

    <div class="game-pad${meta.pad === 'single' ? ' single' : ''}">
      ${meta.pad === 'single' ? '' : `
      <div class="dpad">
        <button class="pad-btn up" data-k="up" aria-label="上"><i class="pad-ic up">${svg('chevron', 24)}</i></button>
        <button class="pad-btn left" data-k="left" aria-label="左"><i class="pad-ic left">${svg('chevron', 24)}</i></button>
        <button class="pad-btn right" data-k="right" aria-label="右"><i class="pad-ic right">${svg('chevron', 24)}</i></button>
        <button class="pad-btn down" data-k="down" aria-label="下"><i class="pad-ic down">${svg('chevron', 24)}</i></button>
      </div>`}
      <div class="acts">
        <button class="act-btn${meta.pad === 'single' ? ' big' : ''}" data-k="a">${meta.action || 'A'}</button>
        ${meta.pad === 'single' ? '' : '<button class="act-btn alt" data-k="b">B</button>'}
      </div>
    </div>
  </div>`;

  $('#gameBack').onclick = () => { saveBestIfBetter(key); stopGame(); showGames(); };

  const canvas = $('#gameCanvas');
  const stage = $('#gameStage');
  const scoreEl = $('#gameScore');
  const labelEl = $('#gameLabel');

  gameInst = window.Games.create(key);
  if (!gameInst) { showGames(); return; }

  let ctx = null;
  let W = 0;
  let H = 0;

  function fit() {
    const rect = stage.getBoundingClientRect();
    const dpr = Math.min(3, window.devicePixelRatio || 1);
    W = Math.max(120, Math.floor(rect.width));
    H = Math.max(120, Math.floor(rect.height));
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    gameInst.resize(W, H);
  }

  // 等一帧，等布局算完再量尺寸
  requestAnimationFrame(() => {
    fit();
    gameInst.reset();
    let last = performance.now();

    function tick(t) {
      const dt = Math.min(60, t - last);
      last = t;

      gameInst.update(dt);
      playGameEvents(gameInst.state.events);
      if (gameInst.state.events) gameInst.state.events.length = 0;
      gameInst.render(ctx, W, H);

      scoreEl.textContent = gameInst.state.score;
      labelEl.textContent = gameInst.state.label || meta.hint;

      if (gameInst.state.over) {
        const bestEl = $('#gameBest');
        if (bestEl) {
          bestEl.textContent = Math.max(Number(bestEl.textContent) || 0, gameInst.state.score || 0);
        }
        finishGame(key, meta.name, gameInst.state.score);
        return;
      }
      gameRaf = requestAnimationFrame(tick);
    }

    // 复活时用它把循环重新拉起来，不用重建整页 DOM
    gameStartLoop = () => {
      if (!gameInst) return;
      last = performance.now();
      if (gameRaf) cancelAnimationFrame(gameRaf);
      gameRaf = requestAnimationFrame(tick);
    };
    gameStartLoop();
  });

  // 虚拟按键：按住连续触发
  root.querySelectorAll('[data-k]').forEach((btn) => {
    const action = btn.dataset.k;
    let timer = null;
    let delay = null;

    const fire = (e) => {
      e.preventDefault();
      if (!gameInst) return;
      gameInst.input(action);
    };
    const start = (e) => {
      buzz(14);
      if (gameInst && gameInst.press) gameInst.press(action);
      fire(e);
      // 跳一跳靠「按住蓄力」，不能连发，否则一按就跳出去了
      if (!gameInst || gameInst.holdRepeat === false) return;
      delay = setTimeout(() => {
        timer = setInterval(() => { if (gameInst) gameInst.input(action); }, 95);
      }, 280);
    };
    const stop = () => {
      clearTimeout(delay);
      clearInterval(timer);
      timer = null;
      if (gameInst && gameInst.release) gameInst.release(action);
    };

    btn.addEventListener('pointerdown', start);
    btn.addEventListener('pointerup', stop);
    btn.addEventListener('pointercancel', stop);
    btn.addEventListener('pointerleave', stop);
    btn.addEventListener('contextmenu', (e) => e.preventDefault());
  });

  // 键盘
  const keyMap = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    w: 'up', s: 'down', a: 'left', d: 'right',
    ' ': 'a', z: 'a', x: 'b', j: 'b', k: 'a',
  };
  const onKey = (e) => {
    const act = keyMap[e.key];
    if (!act || !gameInst) return;
    e.preventDefault();
    // 长按住时浏览器会连发 keydown，蓄力游戏只认第一次
    if (!e.repeat && gameInst.press) gameInst.press(act);
    gameInst.input(act);
  };
  const onKeyUp = (e) => {
    const act = keyMap[e.key];
    if (!act || !gameInst) return;
    if (gameInst.release) gameInst.release(act);
  };
  document.addEventListener('keydown', onKey);
  document.addEventListener('keyup', onKeyUp);

  // 窗口尺寸变化（旋转屏幕 / 拖窗口）
  const onResize = () => {
    if (!gameInst) return;
    const before = { score: gameInst.state.score };
    fit();
    gameInst.state.score = before.score;
  };
  window.addEventListener('resize', onResize);

  // 统一交给 stopGame() 摘，保证每条离开路径都会清理
  gameCleanup = () => {
    document.removeEventListener('keydown', onKey);
    document.removeEventListener('keyup', onKeyUp);
    window.removeEventListener('resize', onResize);
  };
}

/** 中途退出也要记住最高分，否则玩得再高也白费 */
function saveBestIfBetter(key) {
  if (!gameInst) return;
  const s = gameInst.state.score || 0;
  if (s > getBest(key)) setBest(key, s);
}

function finishGame(key, name, score) {
  const prev = getBest(key);
  const isNew = score > prev;
  if (isNew) setBest(key, score);

  // 只停循环，先别拆监听：跳一跳点「复活」还要接着玩
  if (gameRaf) {
    cancelAnimationFrame(gameRaf);
    gameRaf = null;
  }

  const inst = gameInst;
  const canRevive = !!(inst && typeof inst.canRevive === 'function' && inst.canRevive());

  const mask = document.createElement('div');
  mask.className = 'mask';
  mask.innerHTML = `
    <div class="dialog gameover">
      <h4>${isNew ? '新纪录！' : '本局结束'}</h4>
      <p>${name}　得分 <b>${score}</b>${isNew || prev <= 0 ? '' : `<br>最高分 ${prev}`}</p>
      <div class="acts">
        ${canRevive ? '<button class="primary" id="goRevive">复活继续（无限）</button>' : ''}
        <button${canRevive ? '' : ' class="primary"'} id="goAgain">再来一局</button>
        <button id="goBack">返回游戏列表</button>
      </div>
    </div>`;
  phone.appendChild(mask);

  if (canRevive) {
    mask.querySelector('#goRevive').onclick = () => {
      mask.remove();
      inst.revive();
      gameInst = inst;
      if (gameStartLoop) gameStartLoop();
    };
  }

  mask.querySelector('#goAgain').onclick = () => {
    mask.remove();
    stopGame();
    openGame(key);
  };
  mask.querySelector('#goBack').onclick = () => {
    mask.remove();
    stopGame();
    showGames();
  };
}

/** 长按变体标签：重命名或删除。只动变体，原做法不受影响 */
async function manageVariant(id, index) {
  const r = state.recipes.find((x) => x.id === id);
  const v = r && (r.variants || [])[index];
  if (!v) return;
  const label = v.label || '做法';

  const act = await dialog({
    title: '做法管理 · ' + label,
    actions: [
      { label: '重命名', value: 'rename' },
      { label: '删除', value: 'delete', style: 'danger' },
      { label: '取消', value: null },
    ],
  });

  if (act === 'rename') {
    const name = await askText({
      title: '做法名称', message: '', placeholder: label, okLabel: '确定',
    });
    if (!name) return;
    v.label = name;
    await dbPut(r);
    showDetail(id);
    toast('已重命名');
  } else if (act === 'delete') {
    r.variants.splice(index, 1);
    await dbPut(r);
    if (detailVariant >= (r.variants || []).length) detailVariant = -1;
    showDetail(id);
    toast('已删除');
  }
}

// ---------------------------------------------------------------- 买菜清单

const SHOP_KEY = 'zuocai_shopping';

function shopLoad() {
  try { return JSON.parse(localStorage.getItem(SHOP_KEY) || '[]'); } catch { return []; }
}
function shopSave(items) {
  try { localStorage.setItem(SHOP_KEY, JSON.stringify(items)); } catch { /* 忽略 */ }
}

/** 几道菜的食材并进清单。同名合并：用量一样只留一条，不一样就并排（没法做加法） */
function shopAdd(recipes) {
  const items = shopLoad();
  let changed = 0;
  for (const r of recipes) {
    for (const ing of (r.ingredients || [])) {
      const name = (ing.n || '').trim();
      if (!name) continue;
      const amount = (ing.a || '').trim();
      const exist = items.find((i) => i.name.toLowerCase() === name.toLowerCase());
      if (!exist) {
        items.push({ name, amount, checked: false });
        changed++;
      } else if (amount && amount !== exist.amount && !exist.amount.split(' / ').includes(amount)) {
        exist.amount = [exist.amount, amount].filter(Boolean).join(' / ');
        changed++;
      }
    }
  }
  shopSave(items);
  return changed;
}

async function shopDelete(idx, render) {
  const items = shopLoad();
  const it = items[idx];
  if (!it) return;
  const ok = await dialog({
    title: '删除',
    message: `删除「${it.name}」？`,
    actions: [
      { label: '取消', value: false },
      { label: '删除', value: true, style: 'danger' },
    ],
  });
  if (!ok) return;
  items.splice(idx, 1);
  shopSave(items);
  render();
  toast('已删除');
}

        { label: '取消', value: false },

    render();

  const inside = P.videoCanPlayInside(r.videoUrl, type);
  return `

/**
 * 网页端能内嵌的只有直链和 B 站官方播放器。
 * 小红书这类平台会返回 X-Frame-Options，iframe 必然加载失败，只能开新标签。
 */
function playVideo(r) {
  const stage = $('#videoStage');
  if (!stage || !r.videoUrl) return;

  const type = r.videoType || P.detectVideoType(r.videoUrl);
  const embed = P.bilibiliEmbed(r.videoUrl);

  if (type === 'direct') {
    stage.innerHTML = `<video controls autoplay playsinline preload="metadata" src="${esc(r.videoUrl)}"></video>`;
  } else if (embed) {
    stage.innerHTML = `<iframe src="${esc(embed)}" frameborder="0" scrolling="no"
      allowfullscreen allow="autoplay; fullscreen"></iframe>`;
  } else {
    window.open(r.videoUrl, '_blank', 'noopener');
    toast('该平台不允许网页内嵌，已在新标签打开');
    return;
  }
  stage.hidden = false;
  stage.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

          ${r.cover ? `<img data-img="${esc(r.cover)}" alt="" style="display:none">` : ''}

              <div class="ing">

                <span class="a">${esc(i.a || '')}</span>
              </div>`).join('')}</div>` : ''}

          ${steps.length ? `
            <hr class="sep">
            <h3 class="sec-title">做法步骤</h3>
            <div>${steps.map((s, idx) => `
              <div class="step">
                <span class="num">${idx + 1}</span>
                <span class="txt">${esc(s)}</span>
              </div>`).join('')}</div>` : ''}
        </div>
      </div>
    </div>

    <button class="circle-btn left" id="btnBack" aria-label="返回">${svg('back', 21)}</button>
    ${previewing ? '' : `<button class="circle-btn right" id="btnEdit" aria-label="编辑">${svg('edit', 19)}</button>`}
    ${previewing ? '' : `<button class="circle-btn right" id="btnAi" style="right:68px" aria-label="换个做法">${svg('spark', 19)}</button>`}
    ${previewing ? '' : `<button class="circle-btn right ${r.pinned ? 'pinned' : ''}" id="btnPin" style="right:112px" aria-label="常做" title="常做">${svg('pin', 19)}</button>`}

    ${previewing ? `
      <div class="preview-bar">
        <div class="preview-title">预览 · 还没保存</div>
        <div class="preview-acts">
          <button class="btn-ghost" id="pvDiscard">放弃</button>

        </div>

      r.pinned = !r.pinned;
      await dbPut(r);

      toast(r.pinned ? '已加入常做，会置顶显示' : '已取消常做');

    };
    // 长按（触屏）或右键（桌面）管理变体：重命名 / 删除
    let lpTimer = null;
    const cancelLP = () => { if (lpTimer) { clearTimeout(lpTimer); lpTimer = null; } };
    $('#variantRow').addEventListener('pointerdown', (e) => {
      const btn = e.target.closest('button[data-v]');
      if (!btn || btn.dataset.v === '-1') return;
      const vi = Number(btn.dataset.v);
      lpTimer = setTimeout(() => { lpTimer = null; manageVariant(id, vi); }, 500);

      $('#variantRow').addEventListener(ev, cancelLP));

  if ($('#pvDiscard')) $('#pvDiscard').onclick = () => { detailPending = null; showDetail(id); };
  if ($('#pvSave')) $('#pvSave').onclick = () => saveVariant(id);
