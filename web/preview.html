<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF7F2">
<title>我的菜谱 · 预览</title>
<style>
/* 我的菜谱 · 网页预览版
   设计令牌与 Android 版 res/values 保持一致 */

:root {
  --brand: #E2571E;
  --brand-dark: #B8430F;
  --brand-light: #FFEDE3;
  --bg: #FBF7F2;
  --surface: #FFFFFF;
  --surface-sunken: #F4EDE5;
  --text-1: #2A211B;
  --text-2: #7A6B5D;
  --text-3: #A99A8B;
  --divider: #EFE5DA;
  --input-bg: #F6F0E9;
  --chip: #F2E9DF;
  --danger: #C62828;
  --star: #F2A03D;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  background: radial-gradient(circle at 30% 20%, #F3EAE1 0%, #E4DAD0 60%, #D9CCC0 100%);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
               "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
  color: var(--text-1);
  overflow: hidden;
}

/* ---------------------------------------------------------------- 手机外壳 */

.phone {
  position: relative;
  width: min(390px, calc((100vh - 110px) * 390 / 844));
  height: min(844px, calc(100vh - 110px));
  background: var(--bg);
  border-radius: 44px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  flex: 0 0 auto;
  box-shadow:
    0 0 0 11px #1c1c1f,
    0 0 0 13px #3a3a3f,
    0 30px 70px rgba(58, 38, 20, .28);
}

.statusbar {
  flex: 0 0 auto;
  height: 48px;
  padding: 0 26px 4px;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  font-size: 13.5px;
  font-weight: 600;
  letter-spacing: .2px;
  color: var(--text-1);
  user-select: none;
}

.statusbar .icons { display: flex; align-items: center; gap: 5px; }
.statusbar svg { display: block; }

.homebar {
  flex: 0 0 auto;
  height: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.homebar::after {
  content: "";
  width: 134px;
  height: 5px;
  border-radius: 3px;
  background: #C9BEB2;
}

/* ---------------------------------------------------------------- 视图容器 */

.screen {
  position: relative;
  flex: 1 1 auto;
  overflow: hidden;
}

.view {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  background: var(--bg);
}

.view.enter-right { animation: slideInRight .26s cubic-bezier(.22,.61,.36,1); }
.view.enter-left  { animation: slideInLeft  .26s cubic-bezier(.22,.61,.36,1); }

@keyframes slideInRight { from { transform: translateX(100%); } to { transform: translateX(0); } }
@keyframes slideInLeft  { from { transform: translateX(-22%); opacity: .6; } to { transform: translateX(0); opacity: 1; } }

.scroll {
  flex: 1 1 auto;
  overflow-y: auto;
  overflow-x: hidden;
  overscroll-behavior: contain;
  scrollbar-width: none;
}
.scroll::-webkit-scrollbar { display: none; }

/* ---------------------------------------------------------------- 首页 */

.list-header {
  padding: 12px 20px 0;
}
.list-header h1 {
  margin: 0;
  font-size: 27px;
  font-weight: 700;
  letter-spacing: .2px;
}
.list-header .sub {
  margin-top: 5px;
  font-size: 13px;
  color: var(--text-3);
}

.searchbar {
  position: relative;
  margin: 16px 20px 0;
  height: 46px;
  background: var(--input-bg);
  border-radius: 14px;
  display: flex;
  align-items: center;
  padding: 0 14px 0 43px;
}
.searchbar svg.ico {
  position: absolute;
  left: 15px;
  opacity: .45;
}
.searchbar input {
  flex: 1;
  min-width: 0;
  border: 0;
  background: transparent;
  outline: none;
  font-size: 14px;
  color: var(--text-1);
  font-family: inherit;
}
.searchbar input::placeholder { color: var(--text-3); }
.searchbar .clear {
  display: none;
  width: 20px;
  height: 20px;
  margin-left: 8px;
  border: 0;
  padding: 0;
  background: transparent;
  cursor: pointer;
  opacity: .38;
  flex: 0 0 auto;
}
.searchbar .clear.show { display: block; }

.chipbar {
  display: flex;
  gap: 8px;
  padding: 14px 20px 0;
  overflow-x: auto;
  overflow-y: hidden;
  scrollbar-width: none;
  flex: 0 0 auto;
}
.chipbar::-webkit-scrollbar { display: none; }
.chipbar.wrap { flex-wrap: wrap; overflow: visible; row-gap: 8px; }

.chip {
  flex: 0 0 auto;
  padding: 8px 15px;
  border: 0;
  border-radius: 18px;
  background: var(--chip);
  color: var(--text-2);
  font-size: 13px;
  font-family: inherit;
  cursor: pointer;
  transition: background .16s, color .16s;
  white-space: nowrap;
}
.chip.on {
  background: var(--brand);
  color: #fff;
}

/* 卡片网格 */
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  padding: 14px 20px 120px;
}
.grid > * { animation: cardIn .3s backwards; }
@keyframes cardIn { from { opacity: 0; transform: translateY(8px); } }

.card {
  background: var(--surface);
  border: 1px solid var(--divider);
  border-radius: 18px;
  overflow: hidden;
  cursor: pointer;
  transition: transform .12s;
}
.card:active { transform: scale(.975); }

.card .cover {
  position: relative;
  aspect-ratio: 4 / 3;
  background: linear-gradient(315deg, #F6E0CE 0%, #F1D2BC 50%, #E9C2A8 100%);
  display: flex;
  align-items: center;
  justify-content: center;
}
.card .cover img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.card .cover .ph { opacity: .55; }

.card .badge {
  position: absolute;
  top: 8px;
  left: 8px;
  padding: 4px 9px;
  border-radius: 20px;
  background: rgba(255, 255, 255, .94);
  font-size: 10px;
  color: var(--text-2);
  letter-spacing: .2px;
}

.card .body { padding: 11px 12px 12px; }
.card .name {
  font-size: 14px;
  font-weight: 700;
  line-height: 1.32;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  min-height: 18px;
}
.card .meta {
  margin-top: 5px;
  font-size: 11px;
  color: var(--text-3);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* 空状态 */
.empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 60px 30px 0;
  text-align: center;
}
.empty .box {
  width: 86px;
  height: 86px;
  border-radius: 26px;
  background: var(--surface-sunken);
  display: flex;
  align-items: center;
  justify-content: center;
}
.empty h3 { margin: 18px 0 0; font-size: 16px; }
.empty p { margin: 6px 0 0; font-size: 13px; color: var(--text-3); }
.empty .btn {
  margin-top: 20px;
  padding: 11px 22px;
  border: 0;
  border-radius: 30px;
  background: var(--brand);
  color: #fff;
  font-size: 14px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
}

/* 浮动按钮 */
.fab {
  position: absolute;
  right: 22px;
  bottom: 24px;
  width: 58px;
  height: 58px;
  border: 0;
  border-radius: 20px;
  background: var(--brand);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 8px 20px rgba(226, 87, 30, .36);
  transition: transform .14s, box-shadow .14s;
}
.fab:active { transform: scale(.94); box-shadow: 0 4px 12px rgba(226, 87, 30, .3); }

.fab-mini {
  position: absolute;
  left: 24px;
  bottom: 28px;
  width: 42px;
  height: 42px;
  border: 1px solid var(--divider);
  border-radius: 50%;
  background: var(--surface);
  color: var(--text-2);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(60, 40, 25, .1);
}
.fab-mini:active { transform: scale(.94); }

/* 排序菜单 */
.menu {
  position: absolute;
  left: 24px;
  bottom: 78px;
  min-width: 150px;
  background: var(--surface);
  border: 1px solid var(--divider);
  border-radius: 16px;
  padding: 6px;
  box-shadow: 0 12px 30px rgba(60, 40, 25, .16);
  z-index: 30;
  animation: popIn .16s ease-out;
}
@keyframes popIn { from { opacity: 0; transform: translateY(6px) scale(.97); } }
.menu button {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  width: 100%;
  padding: 11px 12px;
  border: 0;
  border-radius: 11px;
  background: transparent;
  color: var(--text-1);
  font-size: 13.5px;
  font-family: inherit;
  text-align: left;
  cursor: pointer;
}
.menu button:hover { background: var(--input-bg); }
.menu button.on { color: var(--brand); font-weight: 600; }

/* ---------------------------------------------------------------- 详情页 */

.detail-cover {
  margin: 8px 16px 0;
  height: 268px;
  border-radius: 22px;
  background: linear-gradient(315deg, #F6E0CE 0%, #F1D2BC 50%, #E9C2A8 100%);
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
}
.detail-cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

.sheet {
  margin: 16px 16px 0;
  background: var(--surface);
  border: 1px solid var(--divider);
  border-radius: 22px;
  padding: 22px 20px 24px;
}
.sheet h2 {
  margin: 0;
  font-size: 23px;
  line-height: 1.35;
}
.info-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 13px;
  flex-wrap: wrap;
}
.pill {
  padding: 5px 11px;
  border-radius: 30px;
  background: var(--brand-light);
  color: var(--brand);
  font-size: 11px;
  font-weight: 700;
}
.meta-item {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  color: var(--text-3);
}
.meta-item svg { flex: 0 0 auto; }
.desc {
  margin-top: 14px;
  font-size: 14px;
  line-height: 1.72;
  color: var(--text-2);
}
.desc.muted { color: var(--text-3); }

/* 视频卡片 */
.video-card {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 16px;
  padding: 13px 12px 13px 14px;
  border-radius: 16px;
  background: var(--surface-sunken);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.video-card:active { opacity: .8; }
.video-card .vplay {
  flex: 0 0 34px;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: var(--brand);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
}
.video-card .vtext {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.video-card .vtext b {
  font-size: 14px;
  color: var(--text-1);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.video-card .vtext i {
  font-style: normal;
  font-size: 11px;
  color: var(--text-3);
}
.video-card .vgo {
  flex: 0 0 auto;
  font-size: 12px;
  font-weight: 700;
  color: var(--brand);
}

.video-stage { margin-top: 12px; }
.video-stage video,
.video-stage iframe {
  display: block;
  width: 100%;
  aspect-ratio: 16 / 9;
  border: 0;
  border-radius: 14px;
  background: #000;
}

.video-state {
  margin-top: 6px;
  font-size: 12px;
  color: var(--text-3);
}
.video-state.bad { color: var(--danger); }

hr.sep {
  border: 0;
  height: 1px;
  background: var(--divider);
  margin: 20px 0 0;
}

.sec-title {
  margin: 20px 0 0;
  font-size: 16px;
  font-weight: 700;
}

.ing {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 0;
  font-size: 14px;
}
.ing .dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--brand);
  flex: 0 0 auto;
}
.ing .n { flex: 1; color: var(--text-1); }
.ing .a { color: var(--text-2); }

.step {
  display: flex;
  gap: 11px;
  margin-top: 14px;
}
.step .num {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--brand-light);
  color: var(--brand);
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
}
.step .txt {
  flex: 1;
  font-size: 14px;
  line-height: 1.72;
  color: var(--text-2);
  padding-top: 1px;
}

/* 悬浮圆形按钮（详情页） */
.circle-btn {
  position: absolute;
  top: 14px;
  width: 40px;
  height: 40px;
  border: 0;
  border-radius: 50%;
  background: rgba(255, 255, 255, .92);
  backdrop-filter: blur(6px);
  color: var(--text-1);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(60, 40, 25, .18);
  z-index: 10;
}
.circle-btn.left { left: 24px; }
.circle-btn.right { right: 24px; }

/* ---------------------------------------------------------------- 编辑页 */

.edit-top {
  flex: 0 0 auto;
  height: 54px;
  display: flex;
  align-items: center;
  padding: 0 16px 0 12px;
  gap: 6px;
}
.edit-top .title {
  flex: 1;
  font-size: 17px;
  font-weight: 700;
}
.icon-btn {
  width: 40px;
  height: 40px;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: var(--text-1);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
.icon-btn:active { background: rgba(0, 0, 0, .05); }

.btn-primary {
  padding: 9px 20px;
  border: 0;
  border-radius: 30px;
  background: var(--brand);
  color: #fff;
  font-size: 14px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
}
.btn-primary:active { background: var(--brand-dark); }

.edit-body { padding: 6px 16px 40px; }

.cover-pick {
  position: relative;
  height: 190px;
  border-radius: 20px;
  background: var(--surface-sunken);
  border: 1.5px dashed #DBCFBF;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--text-3);
  gap: 8px;
  font-size: 12px;
  transition: border-color .16s, background .16s;
}
.cover-pick:hover { border-color: #C9B9A6; background: #F1E9DF; }
.cover-pick img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cover-pick .ph {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  pointer-events: none;
}
.cover-pick .rm {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 30px;
  height: 30px;
  border: 0;
  border-radius: 50%;
  background: rgba(255, 255, 255, .95);
  color: var(--text-1);
  display: none;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 2;
}
.cover-pick.has-img .rm { display: flex; }

.group {
  margin-top: 14px;
  background: var(--surface);
  border: 1px solid var(--divider);
  border-radius: 20px;
  padding: 18px 16px;
}
.group-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 0;
}
.group-title { font-size: 14px; font-weight: 700; }

.btn-soft {
  padding: 6px 12px;
  border: 0;
  border-radius: 30px;
  background: var(--brand-light);
  color: var(--brand);
  font-size: 12px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
}

.field {
  width: 100%;
  height: 48px;
  padding: 0 14px;
  border: 0;
  border-radius: 14px;
  background: var(--input-bg);
  color: var(--text-1);
  font-size: 15px;
  font-family: inherit;
  outline: none;
}
.field::placeholder { color: var(--text-3); }

textarea.field {
  height: auto;
  min-height: 76px;
  padding: 13px 14px;
  line-height: 1.6;
  resize: none;
  font-size: 15px;
}

.label {
  font-size: 12px;
  color: var(--text-3);
  letter-spacing: .4px;
  margin-bottom: 7px;
}

.row-3 {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 10px;
  margin-top: 14px;
}
.row-3 .field {
  text-align: center;
  color: var(--brand);
  font-size: 16px;
  font-weight: 700;
  padding: 0 6px;
}
.row-3 .field.pick {
  font-size: 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* 食材行 */
.ing-row, .step-row {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-top: 8px;
  animation: cardIn .2s backwards;
}
.ing-row .field { height: 44px; font-size: 14px; padding: 0 13px; }
.ing-row .field.name { flex: 1.15; }
.ing-row .field.amt { flex: .85; }

.step-row { align-items: flex-start; margin-top: 10px; }
.step-row .num {
  width: 26px;
  height: 26px;
  margin-top: 9px;
  border-radius: 50%;
  background: var(--brand-light);
  color: var(--brand);
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
}
.step-row textarea.field {
  flex: 1;
  min-height: 62px;
  font-size: 14px;
  padding: 11px 13px;
}

.del-x {
  width: 28px;
  height: 28px;
  border: 0;
  background: transparent;
  color: var(--text-3);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex: 0 0 auto;
  border-radius: 50%;
}
.del-x:active { background: rgba(0, 0, 0, .05); }
.step-row .del-x { margin-top: 8px; }

.danger-btn {
  margin-top: 22px;
  width: 100%;
  padding: 14px;
  border: 0;
  border-radius: 8px;
  background: var(--surface-sunken);
  color: var(--danger);
  font-size: 14px;
  font-family: inherit;
  cursor: pointer;
}

/* ---------------------------------------------------------------- 弹窗 / Toast */

.mask {
  position: absolute;
  inset: 0;
  background: rgba(30, 20, 12, .38);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  animation: fadeIn .16s;
  padding: 32px;
}
@keyframes fadeIn { from { opacity: 0; } }

.dialog {
  width: 100%;
  max-width: 300px;
  background: var(--surface);
  border-radius: 20px;
  padding: 22px 20px 8px;
  animation: popIn .2s ease-out;
}
.dialog h4 { margin: 0; font-size: 16px; }
.dialog p { margin: 8px 0 12px; font-size: 13.5px; line-height: 1.6; color: var(--text-2); }
.dialog .acts { display: flex; flex-direction: column; gap: 2px; }
.dialog .acts button {
  padding: 12px;
  border: 0;
  border-radius: 12px;
  background: transparent;
  font-size: 14.5px;
  font-family: inherit;
  cursor: pointer;
  color: var(--text-1);
}
.dialog .acts button:hover { background: var(--input-bg); }
.dialog .acts button.primary { color: var(--brand); font-weight: 700; }
.dialog .acts button.danger { color: var(--danger); font-weight: 700; }

.toast {
  position: absolute;
  left: 50%;
  bottom: 112px;
  transform: translate(-50%, 12px);
  padding: 11px 20px;
  border-radius: 22px;
  background: rgba(42, 33, 27, .9);
  color: #fff;
  font-size: 13px;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s, transform .2s;
  z-index: 200;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------------------------------------------------------------- 窄屏：铺满 */

@media (max-width: 480px) {
  body { display: block; background: var(--bg); }
  .phone {
    width: 100%;
    height: 100dvh;
    border-radius: 0;
    box-shadow: none;
  }
  .statusbar { display: none; }
  .homebar { display: none; }
  .screen { height: 100%; }
  .view { padding-top: env(safe-area-inset-top); }
  .fab { bottom: calc(24px + env(safe-area-inset-bottom)); }
  .fab-mini { bottom: calc(28px + env(safe-area-inset-bottom)); }
  .list-header { padding-top: 18px; }
}

/* 桌面提示条 */
.hintbar {
  flex: 0 0 auto;
  padding: 8px 16px;
  border-radius: 20px;
  background: rgba(42, 33, 27, .72);
  color: #fff;
  font-size: 12px;
  letter-spacing: .3px;
  user-select: none;
  white-space: nowrap;
}
@media (max-width: 480px) { .hintbar { display: none; } }

/* ================================================================
   编辑页（文本框模式）
   ================================================================ */

.write-card {
  background: var(--surface);
  border: 1px solid var(--divider);
  border-radius: 20px;
  overflow: hidden;
  transition: border-color .16s, box-shadow .16s;
}
.write-card:focus-within {
  border-color: #E9B79C;
  box-shadow: 0 0 0 3px rgba(226, 87, 30, .07);
}

.write-card textarea {
  display: block;
  width: 100%;
  min-height: 200px;
  max-height: 42vh;
  border: 0;
  outline: none;
  resize: none;
  padding: 18px 18px 20px;
  background: transparent;
  color: var(--text-1);
  font-family: inherit;
  font-size: 14.5px;
  line-height: 1.78;
  letter-spacing: .1px;
  overflow-y: auto;
  scrollbar-width: thin;
}
.write-card textarea::-webkit-scrollbar { width: 4px; }
.write-card textarea::-webkit-scrollbar-thumb {
  background: #DDD2C4;
  border-radius: 2px;
}
.write-card textarea::placeholder {
  color: var(--text-3);
  line-height: 1.85;
  font-size: 13.5px;
}

/* 解析状态条 */
.parse-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 11px 4px 0;
  font-size: 12.5px;
  min-height: 30px;
}
.parse-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--text-3);
  flex: 0 0 auto;
  transition: background .2s;
}
.parse-dot.ok { background: #3E9A5C; }
.parse-dot.warn { background: var(--star); }
.parse-dot.idle { background: #CFC3B5; }

.parse-msg {
  flex: 1;
  min-width: 0;
  color: var(--text-2);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.parse-toggle {
  border: 0;
  background: transparent;
  color: var(--brand);
  font-size: 12.5px;
  font-weight: 600;
  font-family: inherit;
  padding: 2px 4px;
  cursor: pointer;
  flex: 0 0 auto;
}

/* 解析预览 */
.parse-preview {
  margin-top: 8px;
  padding: 14px 16px 16px;
  border-radius: 16px;
  background: #FCF8F3;
  border: 1px solid var(--divider);
  animation: cardIn .18s;
}
.pv-title { font-size: 14.5px; font-weight: 700; }
.pv-sec {
  margin-top: 12px;
  font-size: 11px;
  color: var(--text-3);
  letter-spacing: .5px;
}
.pv-ings {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 7px;
}
.pv-ing {
  padding: 4px 9px;
  border-radius: 8px;
  background: #fff;
  border: 1px solid var(--divider);
  font-size: 12px;
  color: var(--text-1);
}
.pv-ing i {
  font-style: normal;
  color: var(--text-3);
  margin-left: 4px;
}
.pv-steps {
  margin: 7px 0 0;
  padding-left: 17px;
  color: var(--text-2);
  font-size: 12.5px;
  line-height: 1.65;
}
.pv-steps li { margin-bottom: 5px; }
.pv-tip {
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px dashed var(--divider);
  font-size: 12px;
  color: var(--text-2);
  line-height: 1.6;
}

/* AI 行 */
.ai-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 14px;
}
.ai-btn {
  flex: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  height: 46px;
  border: 1px solid #EFC9B4;
  border-radius: 16px;
  background: linear-gradient(180deg, #FFF8F3, #FFF2E9);
  color: var(--brand);
  font-size: 14px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  transition: background .16s, border-color .16s;
}
.ai-btn:hover { background: #FFEFE4; border-color: #E9B79C; }
.ai-btn:active { transform: scale(.99); }

.icon-btn.subtle {
  width: 46px;
  height: 46px;
  border: 1px solid var(--divider);
  background: var(--surface);
  border-radius: 16px;
  color: var(--text-2);
}

/* 选项块 */
.opt-block { margin-top: 18px; }
.opt-block > .label { margin-bottom: 9px; }

/* 封面缩略图 */
.cover-strip {
  display: flex;
  align-items: center;
  gap: 12px;
}
.cover-thumb {
  width: 78px;
  height: 78px;
  border-radius: 16px;
  border: 1.5px dashed #DBCFBF;
  background: var(--surface-sunken);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-3);
  cursor: pointer;
  overflow: hidden;
  position: relative;
  flex: 0 0 auto;
  transition: border-color .16s;
}
.cover-thumb:hover { border-color: #C9B9A6; }
.cover-thumb img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.cover-thumb.has-img { border-style: solid; border-color: var(--divider); }
.cover-clear {
  border: 0;
  background: transparent;
  color: var(--text-3);
  font-size: 12.5px;
  font-family: inherit;
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 3px;
  padding: 0;
}

/* 更多选项 */
.more {
  margin-top: 18px;
  border: 1px solid var(--divider);
  border-radius: 16px;
  background: var(--surface);
  overflow: hidden;
}
.more > summary {
  list-style: none;
  padding: 14px 16px;
  font-size: 13px;
  color: var(--text-2);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.more > summary::-webkit-details-marker { display: none; }
.more > summary::after {
  content: "";
  width: 7px;
  height: 7px;
  border-right: 1.6px solid var(--text-3);
  border-bottom: 1.6px solid var(--text-3);
  transform: rotate(45deg) translateY(-2px);
  transition: transform .18s;
}
.more[open] > summary::after { transform: rotate(-135deg) translateY(-2px); }
.more .row-3 { margin: 0; padding: 0 16px 16px; }

/* 设置页说明 */
.note {
  margin-top: 16px;
  padding: 14px 16px;
  border-radius: 14px;
  background: #FCF8F3;
  border: 1px solid var(--divider);
  font-size: 12.5px;
  line-height: 1.75;
  color: var(--text-2);
}
.note b { color: var(--text-1); }
.note code {
  display: inline-block;
  padding: 1px 6px;
  border-radius: 5px;
  background: var(--input-bg);
  color: var(--brand);
  font-size: 11.5px;
  font-family: ui-monospace, Menlo, Consolas, monospace;
}
.note.warn {
  background: #FFF8EC;
  border-color: #F2E0C2;
  color: #8A6A2F;
}

/* 生成中动画 */
.loading {
  display: flex;
  gap: 6px;
  justify-content: center;
  padding: 4px 0 10px;
}
.loading span {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--brand);
  opacity: .35;
  animation: bounce 1.1s infinite ease-in-out;
}
.loading span:nth-child(2) { animation-delay: .16s; }
.loading span:nth-child(3) { animation-delay: .32s; }
@keyframes bounce {
  0%, 80%, 100% { transform: translateY(0); opacity: .35; }
  40% { transform: translateY(-6px); opacity: 1; }
}

/* ================================================================
   网络搜图面板
   ================================================================ */

.mask.sheet {
  align-items: flex-end;
  padding: 0;
}

.picker {
  width: 100%;
  max-height: 82%;
  background: var(--surface);
  border-radius: 24px 24px 0 0;
  display: flex;
  flex-direction: column;
  animation: sheetUp .24s cubic-bezier(.22, .8, .3, 1);
  overflow: hidden;
}
@keyframes sheetUp { from { transform: translateY(100%); } }

.picker-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 16px 10px;
  flex: 0 0 auto;
}
.picker-title { font-size: 15.5px; font-weight: 700; }
.picker-top .icon-btn {
  width: 32px; height: 32px;
  border: 0; background: var(--surface-sunken);
  border-radius: 50%; color: var(--text-2);
}

.picker-search {
  display: flex;
  gap: 8px;
  padding: 0 16px 12px;
  flex: 0 0 auto;
}
.picker-search input {
  flex: 1;
  min-width: 0;
  height: 40px;
  padding: 0 13px;
  border: 1px solid var(--divider);
  border-radius: 12px;
  background: var(--input-bg);
  color: var(--text-1);
  font-size: 14px;
  font-family: inherit;
  outline: none;
}
.picker-search input:focus { border-color: #E9B79C; background: #fff; }
.picker-search button {
  flex: 0 0 auto;
  height: 40px;
  padding: 0 18px;
  border: 0;
  border-radius: 12px;
  background: var(--brand);
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
}
.picker-search button:active { opacity: .85; }

.picker-body {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  padding: 0 16px calc(16px + env(safe-area-inset-bottom));
  scrollbar-width: thin;
}
.picker-body::-webkit-scrollbar { width: 4px; }
.picker-body::-webkit-scrollbar-thumb { background: #DDD2C4; border-radius: 2px; }

.picker-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}

.pick-cell {
  position: relative;
  aspect-ratio: 1 / 1;
  padding: 0;
  border: 0;
  border-radius: 10px;
  overflow: hidden;
  background: var(--surface-sunken);
  cursor: pointer;
  transition: transform .12s;
}
.pick-cell:active { transform: scale(.96); }
.pick-cell img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.picker-hint {
  padding: 26px 8px;
  text-align: center;
  font-size: 13px;
  line-height: 1.75;
  color: var(--text-2);
}

.picker-loading {
  padding: 40px 8px;
  text-align: center;
  font-size: 13px;
  color: var(--text-2);
}
.picker-loading .loading { margin-bottom: 12px; }

.picker-foot {
  padding: 12px 4px 4px;
  text-align: center;
  font-size: 11.5px;
  color: var(--text-3);
}

.picker-more {
  display: block;
  width: 100%;
  height: 40px;
  margin-top: 12px;
  border: 1px solid var(--divider);
  border-radius: 12px;
  background: var(--surface);
  color: var(--text-2);
  font-size: 13px;
  font-family: inherit;
  cursor: pointer;
}
.picker-more:disabled { opacity: .5; cursor: default; }
.picker-more:active:not(:disabled) { background: var(--surface-sunken); }

/* ---------------------------------------------------------------- 导入导出按钮 */

.head-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}
.head-text { min-width: 0; }

.head-actions {
  display: flex;
  gap: 10px;
  flex: 0 0 auto;
  padding-top: 4px;
}

.round-btn {
  width: 38px;
  height: 38px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 0;
  border-radius: 50%;
  background: var(--surface-sunken);
  color: var(--text-2);
  cursor: pointer;
  transition: background .16s, transform .12s;
}
.round-btn:hover { background: #EFE5D9; }
.round-btn:active { transform: scale(.94); }

/* ================================================================
   放松小游戏
   ================================================================ */

.menu-sep {
  height: 1px;
  margin: 5px 8px;
  background: var(--divider);
}
.menu .menu-game span { font-size: 14px; }

/* ---- 游戏列表 ---- */

.games-body { padding: 6px 16px 24px; }

.games-intro {
  padding: 4px 4px 14px;
  font-size: 12.5px;
  line-height: 1.7;
  color: var(--text-3);
}

.game-card {
  display: flex;
  align-items: center;
  gap: 13px;
  width: 100%;
  padding: 14px 14px;
  margin-bottom: 10px;
  border: 1px solid var(--divider);
  border-radius: 18px;
  background: var(--surface);
  color: var(--text-1);
  font-family: inherit;
  text-align: left;
  cursor: pointer;
  transition: transform .12s, border-color .16s, background .16s;
}
.game-card:hover { border-color: #E9B79C; background: #FFFCF9; }
.game-card:active { transform: scale(.985); }

.game-ico {
  flex: 0 0 auto;
  width: 46px;
  height: 46px;
  border-radius: 14px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(315deg, #F6E0CE, #F1D2BC);
  color: var(--brand);
}

.game-info {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.game-name { font-size: 14.5px; font-weight: 700; }
.game-desc {
  font-size: 11.5px;
  line-height: 1.5;
  color: var(--text-3);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.game-best {
  flex: 0 0 auto;
  font-size: 11px;
  color: var(--brand);
  font-weight: 600;
}
.game-card > svg { flex: 0 0 auto; color: var(--text-3); opacity: .6; }

/* ---- 游戏页 ---- */

.game-view { background: var(--bg); }

.game-top {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 16px 10px;
}

.game-head { flex: 1; min-width: 0; }
.game-title { font-size: 16px; font-weight: 700; }
.game-sub {
  margin-top: 2px;
  font-size: 11.5px;
  color: var(--text-3);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.game-score.pill {
  flex: 0 0 auto;
  display: flex;
  align-items: baseline;
  gap: 7px;
  padding: 6px 12px;
  border-radius: 14px;
  background: #F2E9DF;
  color: var(--brand);
}
.game-score.pill span { font-size: 10.5px; color: var(--text-3); }
.game-score.pill b { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 30px; text-align: right; }
.game-score.pill.ghost { color: var(--text-2); }
.game-score.pill.ghost b { color: var(--text-2); }

.game-stage {
  flex: 1 1 auto;
  min-height: 0;
  margin: 0 12px;
  border-radius: 20px;
  overflow: hidden;
  background: #17130F;
  border: 1.5px solid rgba(255, 255, 255, .2);
  box-shadow: 0 10px 30px rgba(23, 19, 15, .18);
  display: flex;
  align-items: center;
  justify-content: center;
}
.game-stage canvas { display: block; }

.game-pad {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 12px;
  padding: 16px 22px calc(20px + env(safe-area-inset-bottom));
  background: #17130F;
}

.dpad {
  display: grid;
  grid-template-columns: repeat(3, 56px);
  grid-template-rows: repeat(3, 56px);
  gap: 6px;
}
.pad-btn {
  border: 0;
  border-radius: 18px;
  background: linear-gradient(180deg, #FFFDFA, #EFE3D4);
  box-shadow: 0 3px 8px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .8);
  color: #5A4A3F;
  font-size: 14px;
  font-family: inherit;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
  transition: background .1s, transform .08s;
}
.pad-btn:active {
  background: linear-gradient(180deg, #C9B8A4, #BCA892);
  transform: scale(.92);
}
.pad-ic { display: inline-flex; color: #5A4A3F; }
.pad-ic.up { transform: rotate(-90deg); }
.pad-ic.down { transform: rotate(90deg); }
.pad-ic.left { transform: rotate(180deg); }
.pad-btn.up { grid-area: 1 / 2; }
.pad-btn.left { grid-area: 2 / 1; }
.pad-btn.right { grid-area: 2 / 3; }
.pad-btn.down { grid-area: 3 / 2; }

.acts {
  display: flex;
  gap: 16px;
  align-items: flex-start;
}
.act-btn {
  width: 66px;
  height: 66px;
  border: 2px solid rgba(255, 255, 255, .3);
  border-radius: 50%;
  background: linear-gradient(180deg, #F08A4B, #E2571E);
  color: #fff;
  font-size: 17px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
  text-shadow: 0 2px 4px rgba(0, 0, 0, .4);
  box-shadow: 0 5px 14px rgba(226, 87, 30, .35);
  transition: transform .08s, box-shadow .1s;
}
.act-btn.alt {
  width: 60px;
  height: 60px;
  margin-top: 26px;
  background: linear-gradient(180deg, #5B84F5, #3B62DB);
  box-shadow: 0 5px 14px rgba(59, 98, 219, .35);
}
.act-btn:active {
  transform: scale(.92);
  box-shadow: 0 2px 6px rgba(0, 0, 0, .3);
}

/* 只要一个大按钮的游戏（跳一跳）：大按钮居中 */
.game-pad.single { justify-content: center; }
.act-btn.big {
  width: 96px;
  height: 96px;
  font-size: 20px;
  letter-spacing: .06em;
}

.gameover .acts { gap: 8px; }
.gameover .acts button {
  width: 100%;
  height: 44px;
  border-radius: 12px;
  border: 1px solid var(--divider);
  background: var(--surface);
  color: var(--text-1);
  font-size: 14px;
  font-family: inherit;
  cursor: pointer;
}
.gameover .acts button.primary {
  border: 0;
  background: var(--brand);
  color: #fff;
  font-weight: 600;
}
.gameover p b { color: var(--brand); font-size: 17px; }

/* 手机全屏时给游戏键位留出安全区 */
@media (max-width: 480px) {
  .game-top { padding-top: calc(14px + env(safe-area-inset-top)); }
}


/* ---------------------------------------------------------------- 做法变体 */
.sheet .chipbar { margin-top: 12px; }

.preview-bar {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 14px 20px 22px;
  background: var(--surface);
  border-top: 1px solid var(--divider);
  box-shadow: 0 -8px 24px rgba(0, 0, 0, .06);
  z-index: 5;
}

.preview-title {
  font-size: 13px;
  color: var(--text-2);
  margin-bottom: 10px;
}

.preview-acts { display: flex; gap: 12px; }
.preview-acts .btn-ghost { flex: 0 0 34%; }
.preview-acts .btn-primary { flex: 1; }

.btn-ghost {
  height: 44px;
  border-radius: 14px;
  border: 1px solid var(--divider);
  background: transparent;
  color: var(--text-1);
  font-size: 15px;
  font-weight: 600;
}

.btn-ghost:active { background: var(--surface-sunken); }

/* 搜索命中高亮 */
.card .name mark {
  background: var(--brand-light);
  color: var(--brand);
  padding: 0 1px;
  border-radius: 3px;
}



/* ---------------------------------------------------------------- 常做 / 买菜清单 */
.badge.pinb {
  left: auto;
  right: 8px;
  background: var(--brand);
  color: #fff;
  font-weight: 600;
}

.circle-btn.pinned { background: var(--brand); color: #fff; }

.shop-list { padding: 6px 14px 16px; }

.shop-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  margin-bottom: 8px;
  border: 1px solid var(--divider);
  border-radius: 14px;
  background: var(--surface);
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  touch-action: pan-y;
}
.shop-item.done { opacity: .55; }

.shop-check {
  flex: 0 0 auto;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: 1.5px solid var(--text-3);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: #fff;
}
.shop-item.done .shop-check {
  background: var(--good);
  border-color: var(--good);
}

.shop-name {
  flex: 1;
  min-width: 0;
  font-size: 15px;
  font-weight: 600;
  color: var(--text-1);
}
.shop-item.done .shop-name { text-decoration: line-through; }
.shop-name em {
  display: block;
  margin-top: 2px;
  font-style: normal;
  font-size: 12px;
  font-weight: 400;
  color: var(--text-3);
}

.shop-empty {
  padding: 60px 24px;
  text-align: center;
  line-height: 1.8;
  color: var(--text-3);
  font-size: 13.5px;
}

.shop-foot {
  flex: 0 0 auto;
  display: flex;

<script>
// App 内置默认菜谱，与 app/src/main/assets/default_recipes.txt 内容一致
window.DEFAULT_RECIPES_TEXT = "==========  菜谱 1  ==========\n\n# 轻卡凉拌鸡丝荞麦面\n\n@分类：凉菜\n@时长：25分钟\n@份量：2人份\n@难度：简单\n@封面：c01\n\n### 食材\n荞麦面 100g、鸡胸肉 150g、虾仁 50g、黄瓜 半根、胡萝卜 半根、紫甘蓝 少许、鸡蛋 1个、蒜末 1勺、葱花 适量、白芝麻 1勺、小米辣 2个、辣椒面 1勺、生抽 2勺、蚝油 1勺、香醋 1勺、热油 2勺\n\n### 步骤\n1. 碗中放蒜末、葱花、白芝麻、切圈小米辣和辣椒面。\n2. 烧滚烫热油，分次淋在辣椒面和芝麻上激出香气，搅拌一下。\n3. 加 2 勺生抽、1 勺蚝油、1 勺香醋搅匀，万能酸辣酱汁就调好了。\n4. 锅中烧水，下荞麦面煮熟，捞出过凉水，口感更筋道、不粘连，沥干备用。\n5. 鸡胸肉冷水下锅加姜片煮熟，放凉后撕成细鸡丝；虾仁焯水备用。\n6. 黄瓜、胡萝卜、紫甘蓝洗净切细丝；鸡蛋摊薄饼切蛋丝，配菜都要沥干水分。\n7. 碗底铺荞麦面，依次码上鸡丝、虾仁、各色蔬菜丝和蛋丝。\n8. 淋上调好的酸辣酱汁，充分翻拌均匀即可。\n\n==========  菜谱 2  ==========\n\n# 清炒黄瓜\n\n@分类：家常菜\n@时长：10分钟\n@份量：2人份\n@难度：简单\n@封面：c02\n\n### 食材\n黄瓜 2根、大蒜 4瓣、葱花 少许、盐 适量、生抽 半勺、白糖 少许、清水 半碗、食用油 适量\n\n### 步骤\n1. 备菜 黄瓜洗净不去皮，斜切薄片；大蒜切末，葱花备用，不用盐水杀水。 ​\n2. 爆香蒜末 热锅倒油，油热下入蒜末小火炒香，炒至微黄不发苦。 ​\n3. 大火翻炒黄瓜 倒入黄瓜片，大火翻炒1分钟，炒至表皮微微变软透亮。 ​\n4. 加水焖入味（湖南特色） 倒入小半碗清水，加少许盐、半勺生抽、一点点白糖去青涩味，盖锅盖小火焖1分钟，焖出薄汤汁。 ​\n5. 翻炒出锅 开盖开大火翻拌十几秒，保留少量汤汁拌饭，撒葱花拌匀即可。\n6. 汤汁少量即可，薄薄一层，不做成水煮款； ​\n7. 想吃酸辣口可以出锅沿锅边淋少许陈醋，不加辣椒也很香； ​\n\n==========  菜谱 3  ==========\n\n# 洋葱炒肉\n\n@分类：家常菜\n@时长：15分钟\n@份量：2人份\n@难度：简单\n@封面：c03\n\n### 食材\n猪肉 200g、洋葱 1 个、生抽 1 勺、老抽 1/ 2 勺、料酒 1 勺、盐 适量、糖 1/ 2 勺、生粉 1 勺、食用油 2 勺、蒜末 适量\n\n### 步骤\n1. 猪肉切片，用生抽、老抽、料酒、盐、糖、生粉腌制 15 分钟。\n2. 洋葱切丝，热锅倒油，蒜末爆香。\n3. 下入腌制好的肉片，快速翻炒至变色。\n4. 加入洋葱丝，大火快炒 2 分钟。\n5. 出锅前尝味，根据个人口味调整盐量。\n6. 出锅装盘，即可享用。\n\n> 小贴士：肉片腌制时间不宜过长，以免失去肉质的嫩滑。\n\n==========  菜谱 4  ==========\n\n# 土豆炒肉\n\n@分类：家常菜\n@时长：20分钟\n@份量：2人份\n@难度：简单\n@封面：c04\n\n### 食材\n食材准备、主料：土豆2个（约300g）、猪肉150g（里脊/前腿肉都可、里脊更嫩）、辅料：大蒜 3瓣、小葱 1根、干辣椒2-3个（不吃辣可省）、调料：生抽 1.5勺、盐 少许、蚝油 半勺、淀粉 1小勺、食用油 适量、清水少许（可选）、步骤做法、第一步：处理食材（关键、防发黑、防粘锅）\n\n### 步骤\n1. 土豆去皮，切薄片/细丝（薄片更易熟，细丝更入味），放入清水中浸泡5-10分钟，洗去表面淀粉，捞出沥干（泡过的土豆炒出来不发黑、不粘黏）。\n2. 猪肉切薄片，加1勺生抽+1小勺淀粉+少许食用油，抓匀腌制10分钟（淀粉锁水，食用油防粘，炒出来的肉超嫩）。\n3. 大蒜切片，小葱切葱花，干辣椒剪段。 第二步：炒香肉片（先炒肉，锁住嫩度）\n4. 热锅冷油，油热后放入腌好的肉片，大火快速翻炒至肉片变色、微微卷曲，立即盛出备用（别炒太久，否则肉会老）。\n5. 锅中留底油，放入蒜片、干辣椒爆香（10秒即可，别炒糊）。 第三步：炒土豆（分两种口感，按需选） 选1：脆爽口感（大火快炒） 倒入沥干的土豆片/丝，大火快速翻炒2-3分钟，炒至土豆表面微微透明、断生即可。 选2：绵软口感（加少许水焖） 倒入土豆片翻炒1分钟，加2-3勺清水，盖锅盖小火焖2-3分钟，焖至土豆用铲子能轻松压碎，再开盖大火收干水分。 第四步：混合调味，出锅\n6. 把炒好的肉片倒回锅中，和土豆一起大火翻炒30秒，让味道融合。\n7. 加半勺蚝油+少许盐（生抽和蚝油有咸味，盐别多放），翻炒均匀。\n8. 撒上葱花，再翻炒10秒，即可出锅。\n9. 土豆泡淀粉是关键，不泡的话炒的时候容易粘锅、发黑，口感也发黏。\n10. 肉片一定要先腌再炒，大火快炒变色就盛出，这是肉嫩的核心。\n11. 喜欢更香的可以加1勺豆瓣酱，和蒜片一起爆香，变成香辣土豆炒肉。\n12. 全程尽量大火，土豆别炒太久，否则会变成土豆泥，影响口感。\n\n==========  菜谱 5  ==========\n\n# 金钱蛋\n\n@分类：家常菜\n@时长：25分钟\n@份量：2人份\n@难度：简单\n@封面：c05\n\n### 食材\n金钱蛋是湖南经典家常菜、因蛋片形似铜钱得名、外酥里嫩、香辣入味、是超下饭的快手菜、成本不到5元、在家轻松复刻 。、食材准备（2-3人份）、鸡蛋：4-5个（土鸡蛋更佳、蛋黄更黄更香）、​、青红辣椒：各1个（或小米辣4- 5个、根据嗜辣程度调整）、大蒜：3-4瓣（多放更香）、蒜叶/蒜苗：1小把（ 可选、增香提味）、豆豉：1小把（湘菜灵魂、） 可选、淀粉：1-2勺（裹蛋片用、防散）、生抽：2勺（调味提鲜）、老抽：少许（上色、盐：适量（根据口味调整）、白糖：少许（中和辣味、提鲜）、食用油：适量（炸蛋需多些）\n\n### 步骤\n1. 煮蛋剥壳（关键基础）\n2. 鸡蛋冷水下锅，水没过鸡蛋2厘米 ​\n3. 大火煮沸后转小火煮10-12分钟（确保蛋黄完全凝固，不易碎） ​\n4. 捞出立即放入冰水中浸泡5-10分钟（热胀冷缩，蛋壳易剥，蛋肉紧致） ​\n5. 剥壳时从鸡蛋钝端开始，轻轻敲碎，慢慢剥除，保持蛋身完整\n6. 切蛋裹粉（防散秘诀）\n7. 刀蘸清水（或抹油），将鸡蛋切成1厘米厚的圆片，每切一刀擦净刀面（防蛋黄粘刀） ​\n8. 蛋片均匀裹一层薄淀粉（不要太厚，否则影响口感），或用淀粉+水调成薄糊裹一层 ​\n9. 用厨房纸轻轻吸干蛋片表面水分（炸时防溅油）\n10. 炸蛋定型（外酥关键）\n11. 锅中倒油，烧至六成热（筷子插入冒密集小气泡） ​\n12. 蛋片分批下锅，中小火慢炸，先不要翻动，让蛋片“躺平”煎2分钟 ​\n13. 底部金黄后翻面，再炸1-2分钟，至两面金黄酥脆捞出控油 ​\n14. 小贴士：炸时出现泡沫是正常现象，撇去即可；别用大火，易外焦里生\n15. 炒香调味（香辣灵魂）\n16. 锅中留少许底油，放入蒜末、豆豉（可选）小火炒香 ​\n17. 加入青红辣椒圈（或小米辣）炒至表皮微皱（约30秒-1分钟） ​\n18. 放入蒜白段（可选）翻炒30秒，再加入炸好的蛋片 ​\n19. 调味：加生抽2勺、老抽少许、盐适量、白糖少许，沿锅边淋1勺清水（防糊锅，让蛋片更入味） ​\n20. 轻轻翻炒（用锅铲推，别使劲扒拉，防蛋片碎），让每片蛋都裹上酱汁 ​\n21. 最后加入蒜叶/蒜苗，翻炒至断生即可出锅\n\n==========  菜谱 6  ==========\n\n# 蒜蓉炒生菜\n\n@分类：家常菜\n@时长：8分钟\n@份量：2人份\n@难度：简单\n@封面：c06\n\n### 食材\n食材准备（2人份）、主料：生菜400g（球生菜或油麦菜均可、推荐湖南本地脆嫩生菜）、​、辅料：大蒜5瓣（切末）、小米辣2个（切圈、可选、嗜辣添加）、调料：食用油 2勺、生抽 1勺、蚝油 半勺、盐 少许、白糖1小撮（提鲜）\n\n### 步骤\n1. 预处理生菜 生菜掰开叶片，放入清水冲洗干净，务必沥干水分（避免炒制时出水过多变软），可切成大片或保持整叶（根据喜好调整）。 ​\n2. 爆香辅料 热锅冷油，油温烧至五成热（微微冒烟），放入蒜末和小米辣圈，小火煸炒10秒，炒出蒜香味（注意别炒糊，蒜末变黑会发苦）。 ​\n3. 大火快炒（关键锁脆步骤） 转最大火，倒入沥干的生菜，快速颠锅翻炒，让每片生菜都裹上蒜香，炒至生菜变软变翠绿（全程不超过1分钟，避免炒老出水）。 ​\n4. 调味出锅 依次加入生抽、蚝油、白糖和少许盐，快速翻炒均匀，确认生菜入味后，立即关火装盘，撒少许葱花（可选）点缀。\n\n==========  菜谱 7  ==========\n\n# 干辣椒炒牛肉\n\n@分类：家常菜\n@时长：20分钟\n@份量：2人份\n@难度：简单\n@封面：c07\n\n### 食材\n食材准备（2-3人份）、主料：牛里脊300g（逆纹切薄片、厚度约2mm）、干辣椒15-20个（根据嗜辣程度调整、推荐用湖南本地朝天椒干）、​、辅料：姜3片（切丝）、蒜5瓣（切片）、青椒1个（切条、可选、增加清爽口感）、蒜苗2根（切段、） 可选、腌肉调料：生抽 1勺、料酒 1勺、玉米淀粉 1勺、食用油 1勺、胡椒粉 少许、炒制调料：生抽 1.5勺、老抽半勺（上色）、蚝油 1勺、盐 少许、白糖半勺（提鲜中和辣味）\n\n### 步骤\n1. 腌制牛肉（关键锁嫩步骤） 切好的牛肉片放入碗中，加入所有腌肉调料，用手抓匀至每片牛肉都裹上薄浆，静置15分钟。最后淋1勺食用油拌匀，防止炒制时粘连。 ​\n2. 预处理辅料 干辣椒剪去蒂部，剪成2cm长的段，去除部分辣椒籽（减少过辣）；姜蒜切好，青椒、蒜苗切好备用。 ​\n3. 大火快炒（避免牛肉变老） ​\n4. 热锅冷油，油温烧至六成热（手放锅上方能感觉到热气），倒入腌好的牛肉片，快速滑散，炒至牛肉表面变色（约30秒），立即盛出备用。 ​\n5. 同一口锅留底油，放入姜丝、蒜片爆香，加入干辣椒段，小火煸炒1分钟至辣椒出香（注意别炒糊，否则会发苦）。 ​\n6. 倒入之前炒好的牛肉片，加入青椒条/蒜苗段，转大火快速翻炒20秒。 ​\n7. 调味收汁 依次加入生抽、老抽、蚝油、白糖，翻炒均匀，根据口味加少许盐（腌肉已有生抽，盐要少放），大火翻炒30秒至汤汁收浓，即可关火装盘。\n\n==========  菜谱 8  ==========\n\n# 小米椒牛肉\n\n@分类：家常菜\n@时长：15分钟\n@份量：2人份\n@难度：简单\n@封面：c08\n\n### 食材\n食材准备、主料：牛里脊/牛柳 150g、小米椒 5-8个（按吃辣程度调整）、​、辅料：大蒜 2- 3瓣、生姜 1小块、青椒 半个（配色提鲜）、腌料：生抽 半勺、料酒 半勺、玉米淀粉 半勺、食用油 半勺、调料：生抽 半勺、蚝油 半勺、盐 少许、白糖 少许、做法步骤\n\n### 步骤\n1. 牛肉逆纹切薄片，加腌料抓匀，腌制10分钟（食用油锁水，炒后更嫩）。 ​\n2. 小米椒、青椒斜切段，大蒜切片，生姜切丝备用。 ​\n3. 热锅冷油，油热后下姜蒜爆香，倒入牛肉大火快速翻炒至变色，立刻盛出。 ​\n4. 锅中留底油，放小米椒和青椒段，翻炒30秒至断生，加少许盐调味。 ​\n5. 倒回炒好的牛肉，加生抽、蚝油、白糖，大火翻炒1分钟，均匀入味后关火出锅\n\n==========  菜谱 9  ==========\n\n# 空气炸锅蛋糕\n\n@分类：甜点\n@时长：60分钟\n@份量：2人份\n@难度：简单\n@封面：c09\n\n### 食材\n鸡蛋 3个、低筋面粉 90g、牛奶 50ml、食用油 30ml、细砂糖 50g、柠檬汁 几滴、油纸 1张\n\n### 步骤\n1. 取干净碗倒入油和牛奶，可用冲泡好的温热奶粉替代，搅拌至完全乳化。\n2. 加入面粉，用刮刀翻拌均匀，别过度搅拌起筋。\n3. 打入 3 个鸡蛋，蛋黄分离出来加入面糊搅至顺滑无颗粒，蛋清放进无油无水的大碗。\n4. 蛋清加 5-6 小勺细砂糖和少许柠檬汁，用打蛋器中速打发至提起能拉出直立小尖角。\n5. 取 1/3 蛋清放进蛋黄糊翻拌均匀，再全部倒回剩余蛋清，翻拌至无明显结块。\n6. 面糊倒入垫了油纸的炸篮，轻震几下排出气泡。\n7. 空气炸锅 160℃ 烤 45 分钟，出炉放凉后切块。\n\n==========  菜谱 10  ==========\n\n# 冷冻饺子煎饺\n\n@分类：主食\n@时长：15分钟\n@份量：2人份\n@难度：简单\n@封面：c10\n\n### 食材\n冷冻饺子 15个、清水 适量、食用油 适量、淀粉 1勺\n\n### 步骤\n1. 煎底：平底锅刷一层薄油，中小火加热，将冷冻饺子均匀摆入，煎1-2分钟至饺子底部呈金黄色。 ​\n2. 煮制：沿锅边倒入清水，水量没过饺子1/3即可，立刻盖上锅盖，转中火煮5-6分钟，让饺子熟透。 ​\n3. 收脆：打开锅盖，转小火将剩余水分煎干，再煎1分钟让底部更酥脆，关火即可出锅。\n\n> 小贴士：- 全程别用大火，防止底部焦糊、内部没熟。 ​ - 喜欢冰花底的话，可在加水时调一碗淀粉水（淀粉:水=1:10）代替清水，煎出来的冰花更漂亮。 要不要我给你调一份湖南口味的酸辣蘸料配方，搭配煎饺吃更开胃？\n\n==========  菜谱 11  ==========\n\n# 农家一碗香\n\n@分类：家常菜\n@时长：20分钟\n@份量：2人份\n@难度：简单\n@封面：c11\n\n### 食材\n带皮五花肉 200g、青椒 2个、红椒 1个、蒜薹1小把、鸡蛋 2个、大蒜 3瓣、生姜1小块、干辣椒3- 4个、生抽 1勺、料酒 1勺、老抽 半勺、盐 少许、鸡精 少许\n\n### 步骤\n1. 食材预处理 五花肉切薄片；青红椒去籽切菱形块；蒜薹洗净切段；大蒜切片，生姜切丝；鸡蛋加少许盐打散，下锅煎成薄蛋饼，盛出后切条备用。 ​\n2. 煸炒五花肉 热锅不放油，下入五花肉片中小火煸炒，直到肉片出油、边缘微焦，盛出多余的油脂，只留少许底油在锅中。 ​\n3. 爆香调味 锅中留底油，放入姜丝、蒜片、干辣椒爆香，下入青红椒块和蒜薹段，大火翻炒至食材微微变软。 ​\n4. 混合翻炒 倒入煸好的五花肉片和蛋条，加料酒、生抽、老抽翻炒均匀，根据口味加少许盐和鸡精调味，大火快速翻炒1分钟即可出锅。\n\n> 小贴士：- 五花肉尽量切薄，煸炒时出油更彻底，口感不腻；没有蒜薹可以用蒜苗、芹菜替换。 ​ - 调味时老抽仅用于上色，不要放多，避免菜品发黑。\n\n==========  菜谱 12  ==========\n\n# 干辣椒炒肉丸\n\n@分类：家常菜\n@时长：20分钟\n@份量：2人份\n@难度：简单\n@封面：c12\n\n### 食材\n核心：肉丸250g（三鲜肉丸/猪肉丸最佳、切半或切十字花刀、易入味）、​、香辣灵魂：干辣椒8-10个（剪段、根据辣度耐受调整、小米辣2个 可选、加辣）、花椒1小把（青红花椒均可、增香）、配菜：芹菜1小把（切段、或蒜苗2根切段、增加香气和脆感）、蒜3瓣（切片）、生姜1片（切丝）、白芝麻少许（ 可选、调味：生抽 1勺、盐 少许、白糖半勺（中和辣味、提鲜）、料酒1勺（去腥）、食用油适量（稍多 一点、干炒更香浓）\n\n### 步骤\n1. 预处理：肉丸切半（或表面划2刀），芹菜/蒜苗洗净切段，干辣椒剪段（去籽可减辣），蒜切片、姜切丝。 ​\n2. 煎/炸肉丸（关键一步）： ​\n3. 省事版：热锅放多一点油，中火放入肉丸，煎至表面金黄酥脆（约3分钟），捞出沥干油分（吸掉多余油脂，不腻）。 ​\n4. 快手版：用空气炸锅180℃烤8分钟，或微波炉加热2分钟后，再用少许油煎至金黄（省时省油）。 ​\n5. 炒出香辣味：同一口锅，留少许底油，转小火放入干辣椒段、花椒，慢慢炒出香味（别炒糊，否则发苦），再加入蒜片、姜丝爆香。 ​\n6. 混合翻炒：放入芹菜/蒜苗段，大火翻炒30秒（保持脆嫩），倒入煎好的肉丸，沿锅边淋1勺料酒去腥，加1勺生抽、少许盐、半勺白糖，大火快速翻炒1分钟，让每个肉丸都裹上香辣酱汁，最后撒上白芝麻（可选）即可出锅。 关键技巧（长沙口味适配+成功关键）：\n7. 肉丸一定要先煎/炸至表面金黄酥脆，不仅不松散，还能吸收香辣酱汁，口感更有层次。 ​\n8. 干辣椒和花椒要“小火慢炒出香”，这是“干香”的核心，火大容易糊，香味也出不来。 ​\n9. 调味别复杂：生抽提鲜、少许盐补味、半勺白糖是灵魂，能中和辣味还不抢香，长沙人炒香辣菜都爱加一点。 ​\n10. 配菜可选：没有芹菜/蒜苗，用洋葱丁、青椒块也可以，保持脆感即可，别炒太软。 口味升级（贴合长沙本地偏好）：\n11. 加1勺豆豉（提前冲洗干净，和干辣椒、花椒一起炒），鲜香味更浓，是长沙家常菜的经典搭配。 ​\n12. 喜欢更麻更辣：花椒用量加倍，或最后撒一把辣椒面，翻炒均匀（香辣加倍，越吃越上头）。 ​\n13. 用自制三鲜肉丸：虾仁和马蹄的脆感，搭配干香辣味，口感更丰富，比纯猪肉丸更解腻。\n\n==========  菜谱 13  ==========\n\n# 干辣椒炒肉炒蛋\n\n@分类：家常菜\n@时长：20分钟\n@份量：2人份\n@难度：简单\n@封面：c13\n\n### 食材\n核心：猪肉150g（选前腿肉/五花肉、肥瘦3:7、香而不柴）、鸡蛋 2个、​、香辣灵魂：干辣椒8-10个（剪段、去籽减辣、按耐受度调整）、花椒1小把（青红均可、增香）、辅料：蒜3瓣（切片）、生姜1片（切丝）、青椒1个（ 可选、切小丁、增加脆感）、白芝麻少许（可选）、调味：生抽 1.5勺、盐 少许、白糖半勺（中和辣味提鲜）、料酒1勺（去腥）、食用油 适量\n\n### 步骤\n1. 预处理： ​\n2. 猪肉切细丝（或薄片），加1勺生抽、半勺料酒、少许淀粉抓匀，腌制5分钟（更入味、不柴）； ​\n3. 鸡蛋打散，加少许盐搅匀（提前调味）； ​\n4. 干辣椒剪段，蒜切片、姜切丝，青椒切小丁（无则省略）。 ​\n5. 炒滑蛋（关键：嫩！）： 热锅放多一点油，油热后倒入蛋液，大火快速翻炒至蛋液凝固（呈嫩黄色），立即盛出备用（别炒老，后续还要回锅）。 ​\n6. 炒猪肉： 同一口锅，留少许底油，放入腌制好的猪肉丝，大火快速翻炒至表面变色、微微金黄（约1.5分钟），盛出备用。 ​\n7. 炒出香辣底味： 锅中补少许油，转小火放入干辣椒段、花椒，慢慢炒1分钟至出香（别炒糊，否则发苦），加入蒜片、姜丝、青椒丁（如有），大火爆香30秒。 ​\n8. 混合翻炒调味： 倒入炒好的猪肉丝和滑蛋，沿锅边淋1勺料酒去腥，加1.5勺生抽、少许盐、半勺白糖，大火快速翻炒1分钟，让食材均匀裹上香辣酱汁，最后撒白芝麻即可出锅。 关键技巧（长沙口味适配+成功核心）：\n9. 鸡蛋要“快炒快盛”，保持滑嫩口感；猪肉提前腌制，不柴还入味。 ​\n10. 干辣椒+花椒必须“小火慢炒出香”，这是“干香”的关键，火大易糊发苦。 ​\n11. 调味别复杂：生抽提鲜、白糖中和辣味，长沙人炒香辣菜都爱加半勺，不抢香还解腻。 ​\n\n==========  菜谱 14  ==========\n\n# 紫菜蛋花汤\n\n@分类：汤羹\n@时长：10分钟\n@份量：2人份\n@难度：简单\n@封面：c14\n\n### 食材\n食材（2人份）、干紫菜5g（1小把）、鸡蛋 2个、葱花 1根、盐 1小勺、香油 3滴、清水 500ml、​、提鲜：鸡精/味精1/4小勺 可选、香菜 1根、生抽 3滴\n\n### 步骤\n1. 鸡蛋打入碗中，加1勺清水搅打至起细泡；紫菜用温水冲10秒去杂质，挤干水分；葱花切好备用。 ​\n2. 锅中加清水烧开，放入紫菜，煮1分钟至紫菜完全散开。 ​\n3. 转小火微沸，沿锅边缓慢淋入蛋液，静置10秒后轻划散蛋花。 ​\n4. 加适量盐，可选加少许鸡精或3滴生抽提鲜，煮30秒关火，撒葱花、香菜，滴香油即可。 提鲜小妙招\n5. 没有虾皮也香浓：用1勺鸡汤/骨汤冻融化替代部分清水，或加1小块豆腐丁，口感更丰富。 ​\n6. 避免生抽放多：滴完后搅拌均匀，尝味后再补盐，防止汤变咸变浑。\n\n==========  菜谱 15  ==========\n\n# 胡萝卜炒肉\n\n@分类：家常菜\n@时长：15分钟\n@份量：2人份\n@难度：简单\n@封面：c15\n\n### 食材\n食材（2人份、性价比高）、主料：胡萝卜1根（约200g）、猪肉150g（选五花肉/瘦肉均可、五花肉更香）、​、辅料：姜蒜各 少许、生抽 1勺、料酒 1勺、盐 半勺、淀粉1小勺（可选）、食用油 2勺、步骤（10分钟搞定、操作简单）\n\n### 步骤\n1. 预处理：胡萝卜去皮切薄片；猪肉切薄片，加料酒+淀粉抓匀腌制5分钟（更嫩不柴）；姜蒜切末。 ​\n2. 炒肉：热锅倒油，油热后下姜蒜爆香，放入腌好的猪肉，大火快速翻炒至变色，盛出备用。 ​\n3. 炒胡萝卜：同一口锅补少许油，放入胡萝卜片，中小火翻炒2分钟至变软（避免炒糊）。 ​\n4. 混合调味：倒入炒好的猪肉，加生抽、盐，大火快速翻炒1分钟，让调料均匀裹住食材，关火出锅。 关键小贴士\n5. 猪肉选带点肥的，炒出来的油炒胡萝卜更香浓，不用额外多放油。 ​\n6. 胡萝卜别炒太久，保持微脆口感更爽口，也能保留更多营养。 ​\n7. 全程大火快炒，避免食材出水，口感更紧实。\n\n==========  菜谱 16  ==========\n\n# 挂面炒鸡蛋\n\n@分类：主食\n@时长：15分钟\n@份量：2人份\n@难度：简单\n@封面：c16\n\n### 食材\n挂面 150g、鸡蛋 3个、葱花 适量、蒜末 2瓣、青菜 少许、火腿丁 少许、生抽 1勺、老抽 半勺、盐 少许、白糖 少许、食用油 适量\n\n### 步骤\n1. 挂面煮至七八成熟（比包装说明少煮2分钟），捞出过凉水沥干，加少许食用油拌匀防粘连；\n2. 3个鸡蛋打散，锅中放多一点油，炒至蓬松盛出备用；\n3. 锅中留底油，放葱花、蒜末爆香（可选加青菜段、火腿丁），倒入挂面翻炒1分钟；\n4. 加1勺生抽、半勺老抽、少许盐和糖调味，倒入炒好的鸡蛋，快速翻匀出锅，撒葱花即可。 关键技巧\n5. 挂面过凉水+拌油，炒时不坨；鸡蛋提前炒好再回锅，口感更嫩。\n6. 调味可灵活调整，加少许蚝油提鲜或小米辣增辣都合适。\n\n==========  菜谱 17  ==========\n\n# 藕片炒肉\n\n@分类：家常菜\n@时长：15分钟\n@份量：2人份\n@难度：简单\n@封面：c17\n\n### 食材\n藕片炒肉（脆嫩入味版）、食材（2人份）：脆藕1节、猪里脊肉/梅花肉 200g、青椒 1个、蒜 3瓣、生抽 2勺、料酒 1勺、淀粉 1小勺、盐 少许、白糖半勺（提鲜）。\n\n### 步骤\n1. 肉切薄片，加料酒、1勺生抽、淀粉抓匀，腌制10分钟（锁水更嫩）；藕去皮切薄片，泡清水中加少许白醋（防氧化发黑，保持脆感）。 ​\n2. 热锅冷油，放肉片滑炒至变色，盛出备用；锅中留底油，爆香蒜末、青椒片。 ​\n3. 倒入藕片大火快炒2分钟（别炒久，否则变软），加1勺生抽、白糖、少许盐调味。 ​\n4. 倒回炒好的肉片，快速翻匀10秒，关火出锅。 关键技巧：选藕时挑表皮光滑、藕孔细小的（脆藕），炒的全程用大火，盐后放可减少藕片出水。\n\n==========  菜谱 18  ==========\n\n# 葱煎蛋\n\n@分类：家常菜\n@时长：10分钟\n@份量：2人份\n@难度：简单\n@封面：c18\n\n### 食材\n家常葱煎蛋（简洁版）、核心秘诀：热锅倒油防粘、中小火慢煎锁嫩、食材（2人份）、主料：鸡蛋 3个、香葱2根（切葱花）、调料：盐 1小勺、食用油 2勺、白胡椒粉少许（可选）\n\n### 步骤\n1. 鸡蛋打入碗中，加葱花、盐、白胡椒粉，搅打至蛋液起泡。\n2. 平底锅烧至微冒烟，倒油晃匀锅底。\n3. 转中小火倒蛋液，底部凝固后轻推边缘防粘；双面煎就翻面再煎1分钟，溏心蛋单面煎1.5分钟关火焖10秒。 关键技巧\n4. 先炸葱白再倒蛋液，香味更浓。\n5. 全程中小火，避免外焦里生。\n6. 撒芝麻或淋1滴生抽，风味更足。 需要我帮你整理葱煎蛋的创意搭配\n\n==========  菜谱 19  ==========\n\n# 花菜炒肉\n\n@分类：家常菜\n@时长：15分钟\n@份量：2人份\n@难度：简单\n@封面：c19\n\n### 食材\n花菜 半个、猪肉200g（五花肉/前腿肉都行、五花肉更香）、蒜 3瓣、干辣椒2个（可选）、腌肉料：生抽 1勺、料酒 半勺、淀粉 半勺、食用油 少许、调味：生抽 1勺、蚝油 半勺、盐 少许\n\n### 步骤\n1. 处理花菜 花菜掰成小朵，清水里加一小勺盐浸泡10分钟，冲干净。 锅里烧水，水开放花菜焯水60秒，捞出沥干。（焯水可以缩短炒制时间，花菜熟得均匀，不夹生；不想焯水就多炒一会儿） ​\n2. 腌肉（肉嫩入味关键） 肉切薄片，加腌肉料抓匀，腌10分钟。加一点油锁住水分，炒出来不会粘在一起。 ​\n3. 开炒 热锅少油，下入肉片，中火滑炒至变色，立刻盛出来备用。 同一口锅补少许油，下蒜末、干辣椒爆香，倒入花菜大火翻炒1分钟。 倒回肉片，放生抽、蚝油，大火快速翻炒均匀。 尝味道，酌情补一点点盐，翻炒几下直接出锅。 小要点\n4. 喜欢焦香口感：花菜不焯水，大火干煸到表面微微焦黄再放肉，更香。 ​\n5. 不要加水焖太久，花菜出水变软就失去脆感。 ​\n6. 口味可选：想吃带点辣味，可以加一勺豆瓣酱，爆香后再下花菜。\n\n==========  菜谱 20  ==========\n\n# 湖南辣椒炒肉\n\n@分类：家常菜\n@时长：20分钟\n@份量：2人份\n@难度：简单\n@封面：c20\n\n### 食材\n核心要点：带肥前腿肉、干煸辣椒、大火快炒、豆豉提香、不勾芡、食材（2人份）、主料：猪前腿肉250g（优先选肥瘦相间！肥肉单独切薄片、瘦肉切片、逆着肉纹切、3mm厚度最佳、梅花肉/五花肉也能替代）、​、辣椒：青椒、彩椒（就是你刚才切好的这一份、斜滚刀切块、螺丝椒最佳）、辅料：大蒜4瓣（拍碎！不要切末）、豆豉一小撮（灵魂！没有可以省略）、调味：生抽 1.5勺、蚝油 半勺、老抽几滴（仅上色、千万别多）、盐 少许、白糖小半勺（提鲜）、料酒 半勺\n\n### 步骤\n1. 瘦肉简单腌制（5分钟就行，不用久腌） 瘦肉片加：半勺料酒+几滴老抽+半勺蚝油，抓匀放一旁。 ❗不要放淀粉，正宗湖南辣椒炒肉不挂浆，吃的是肉香。\n2. 干煸辣椒（最关键一步！出虎皮、释放椒香） 锅烧烫，不放油，直接下青红椒，中火，锅铲用力按压辣椒，反复翻炒。 炒到辣椒变软、表皮起皱，出现一点点焦黄色虎皮，撒一点点盐入底味，盛出来备用。\n3. 煸肥肉，炼出猪油（香味来源） 锅不用洗，放少许菜籽油（猪油更香），下肥肉片中小火煸炒，一直炒到肥肉卷曲、出油，变成半透明油渣。 油太多就舀出来一部分，油多会腻。\n4. 炒瘦肉 下入腌好的瘦肉，大火快速滑散，肉片一变色马上放入拍蒜+豆豉，翻炒10秒炒出豉香蒜香。\n5. 混合辣椒+调味出锅 倒入之前煸好的辣椒，放生抽、小半勺白糖，全程大火快速翻炒30~60秒，尝咸淡，缺盐补一点点盐。 沿锅边喷一点点料酒，听到“滋啦”响，锅气直接拉满，立刻关火装盘！ 💡避坑重点（湖南家常关键点）\n6. 火候必须大火，全程快炒，炒久肉直接变老发柴； ​\n7. 老抽只能几滴，加多发黑发苦； ​\n8. 辣椒先干锅煸，这一步不能省，不然只有生辣椒味，没有焦香； ​\n9. 豆豉是灵魂，少量即可，不要放多，不然会发苦； ​\n10. 不加水、不勾芡！这道菜吃干香油润的锅气。 备选简易版本（家里火不大，不容易爆炒） 辣椒不用干煸。肥肉煸出油后，下瘦肉炒至变色，放蒜豆豉，直接倒入青红椒，大火炒到辣椒断生，再调味出锅。味道稍弱，但简单省事。\n\n==========  菜谱 21  ==========\n\n# 家常辣椒炒肉\n\n@分类：家常菜\n@时长：15分钟\n@份量：2人份\n@难度：简单\n@封面：c21\n\n### 食材\n家常辣椒炒肉（简洁版）、核心秘诀：肉片腌制锁水、大火快炒保脆嫩、食材（2人份）、主料：带肥猪肉 250克、线椒/杭椒 300克、蒜 3瓣、姜 2片、调料：生抽 2勺、老抽 半勺、料酒 1勺、淀粉 1小勺、盐 少许、白糖 半勺、食用油 2勺\n\n### 步骤\n1. 猪肉逆纹切薄片，加料酒、生抽、淀粉、半勺食用油抓匀，腌制10分钟。\n2. 少油热锅，下辣椒大火炒2分钟至起皱，加盐调味盛出。\n3. 倒油爆香姜蒜，下肉片大火滑炒1.5分钟至变色出油。\n4. 倒回辣椒，加生抽、老抽、白糖，大火快炒30秒，滴香醋提香即可出锅。 关键技巧\n5. 选肥瘦相间的肉，炒出油脂更香。\n6. 全程大火快炒，总时长不超5分钟。\n7. 辣椒先加盐调味，避免整体过咸。 需要我帮你整理辣椒炒肉的食材分量换算表，方便你按人数调整用量吗\n\n==========  菜谱 22  ==========\n\n# 苤蓝片炒肉\n\n@分类：家常菜\n@时长：15分钟\n@份量：2人份\n@难度：简单\n@封面：c22\n\n### 食材\n苤蓝片炒肉炒大蒜叶（简化家常版）、食材（2人份）、主料：苤蓝1个（去皮后约 300g、切薄片）、猪肉150g（肥瘦相间、大蒜叶1小把（切段、蒜白蒜叶分开）、​、辅料：生姜 2片、盐 1小勺、生抽 1勺、料酒 1勺、淀粉 少许、食用油 2勺、做法（10分钟搞定）\n\n### 步骤\n1. 猪肉片加1勺料酒、少许淀粉抓匀，腌制5分钟（锁水不柴）；苤蓝片用清水淘洗2遍，沥干备用。 ​\n2. 热锅倒油，放姜片爆香，倒入腌好的猪肉片，大火快速滑炒至变色，盛出备用。 ​\n3. 同一口锅留底油，放入蒜白段翻炒10秒，倒入苤蓝片，大火翻炒1分钟至断生。 ​\n4. 倒回炒好的猪肉片，加1勺生抽、1小勺盐，翻炒均匀后，放入蒜叶段，再大火翻30秒即可出锅。 关键小贴士\n\n==========  菜谱 23  ==========\n\n# 蛋炒饭\n\n@分类：主食\n@时长：10分钟\n@份量：2人份\n@难度：简单\n@封面：c23\n\n### 食材\n米饭 2碗、鸡蛋 2个、葱花 适量、生抽 1勺、盐 适量、白胡椒粉 少许、食用油 适量\n\n### 步骤\n1. 热锅倒油，中小火倒入蛋液，快速炒成细碎蛋花，盛出备用。 ​\n2. 同一口锅补少许油，大火烧热，倒入米饭，翻炒1分钟至松散（用锅铲打散结块）。 ​\n3. 加配菜翻炒30秒，淋生抽1勺，炒匀后倒入蛋碎，轻轻翻拌（别弄碎蛋花）。 ​\n4. 加盐、白胡椒粉调味，大火翻10秒，撒葱花出锅。\n\n> 小贴士：全程大火，迅速翻炒。\n\n==========  菜谱 24  ==========\n\n# 手撕包菜\n\n@分类：家常菜\n@时长：10分钟\n@份量：2人份\n@难度：简单\n@封面：c24\n\n### 食材\n清爽版手撕包菜（精简总结）、核心： 手撕去梗、大火快炒、醋分两次放、食材（2人份）、包菜 500g、蒜 5瓣、干辣椒3- 5个、花椒1小把、生抽 2勺、香醋 1.5勺、白糖 半勺、盐 少许、油2- 3勺、步骤（5步速做）\n\n### 步骤\n1. 包菜手撕去梗，洗净擦干\n2. 调汁：生抽+1勺香醋+白糖+盐搅匀\n3. 冷锅热油，小火炸香花椒捞出，炒香蒜片+干辣椒\n4. 转大火，倒入包菜快炒30秒-1分钟（脆软状态）\n5. 淋料汁翻匀，再淋0.5勺香醋，翻炒10秒出锅\n\n> 小贴士：包菜做的时候，葱和蒜油不要太热，不然一下就炒糊，炒包菜的时候要快速翻炒。一定要快速翻炒，不然包菜可能会炒黑。\n\n==========  菜谱 25  ==========\n\n# 小米辣炒肉\n\n@分类：家常菜\n@时长：15分钟\n@份量：2人份\n@难度：简单\n@封面：c25\n\n### 食材\n小米辣炒肉（家常鲜辣版）、核心关键：肉片提前腌制锁嫩、全程大火快炒、小米辣爆香不煮烂。、一、食材（2-3人份）、主料：猪肉300g（前腿肉/梅花肉最佳、里脊需多1勺油）、小米辣8-12根（切圈、按辣度调）、辅料：青椒2根（切条）、蒜3瓣（切片）、姜2片（切丝）、葱花 少许、调料：生抽 2勺、蚝油 1勺、料酒 1勺、盐 少许、白糖 半勺、淀粉 1勺、食用油 适量、二、步骤（10分钟）\n\n### 步骤\n1. 猪肉逆纹切薄片，加1勺料酒、1勺生抽、半勺淀粉、少许油抓匀，腌制10分钟。\n2. 备齐辅料，调碗汁：1勺生抽+1勺蚝油+半勺白糖+少许盐+2勺清水搅匀。\n3. 锅热油，倒入肉片大火滑炒30秒变色盛出；留底油，爆香姜蒜，加小米辣、青椒炒1分钟。\n4. 倒回肉片，淋碗汁快炒20秒裹匀酱汁，撒葱花出锅。 三、小贴士\n5. 肉片锁嫩：淀粉/蛋清二选一，腌制≥8分钟。\n6. 全程大火快炒，总时长≤5分钟，避免食材变柴出水。\n7. 辣度调整：微辣用小米辣+线椒1:1；特辣加2根小米辣泡椒增香。\n\n==========  菜谱 26  ==========\n\n# 打散版煎蛋\n\n@分类：家常菜\n@时长：5分钟\n@份量：2人份\n@难度：简单\n@封面：c26\n\n### 食材\n鸡蛋 2个、食用油 1勺、盐 少许、黑胡椒 少许、葱花 少许\n\n### 步骤\n1. 鸡蛋打入碗中，加少许盐用筷子充分打散，打到蛋液起泡，口感更蓬松。\n2. 平底锅烧至微热倒油，转动锅让油铺满锅底，油面微微冒小泡即可。\n3. 倒入蛋液，小火慢煎约 1 分钟，待底部定型后用铲子从边缘向中间推。\n4. 翻面再煎 30 秒，喜欢溏心就少煎 10 秒，出锅前撒黑胡椒、葱花。\n\n> 小贴士：油别太多，全程小火防糊；打散时加 1 勺清水或牛奶，煎出来更软嫩。\n\n==========  菜谱 27  ==========\n\n# 白菜炒蛋\n\n@分类：家常菜\n@时长：10分钟\n@份量：2人份\n@难度：简单\n@封面：c27\n\n### 食材\n小白菜 300g、鸡蛋 3个、大蒜 2瓣、盐 适量、食用油 适量\n\n### 步骤\n1. 小白菜洗净从中间切一刀，菜梗和菜叶分开；鸡蛋加少许温水打散，大蒜切片。\n2. 热锅倒油，中火倒入蛋液快速滑炒至定型呈嫩黄色，盛出备用。\n3. 锅中补少许油，爆香蒜片，先下菜梗炒 1 分钟变软，再下菜叶大火炒 30 秒至断生。\n4. 倒回炒蛋，加盐快速翻匀即可出锅。\n\n> 小贴士：青菜别炒太久，保持脆嫩；喜欢辣可在爆蒜时加 1 根小米辣。\n\n==========  菜谱 28  ==========\n\n# 火腿炒鸡蛋\n\n@分类：家常菜\n@时长：8分钟\n@份量：2人份\n@难度：简单\n@封面：c28\n\n### 食材\n火腿 1根、鸡蛋 3个、葱花 少许、盐 少许、食用油 适量、生抽 少许\n\n### 步骤\n1. 火腿切约 0.3 厘米厚的薄片；鸡蛋加少许盐和 1 勺清水打散，炒出来更蓬松。\n2. 热锅倒油，倒入蛋液大火快速划散，定型蓬松后盛出备用。\n3. 锅中留底油，中小火下火腿片炒 1-2 分钟，炒出香味、表面微焦即可。\n4. 倒回鸡蛋翻匀，淋少许生抽提鲜，撒葱花炒两下出锅。\n\n> 小贴士：切片火腿不耐久炒，表面微焦就要停，炒久了口感发硬。\n\n==========  菜谱 29  ==========\n\n# 红糖姜茶\n\n@分类：汤羹\n@时长：15分钟\n@份量：2人份\n@难度：简单\n@封面：c29\n\n### 食材\n生姜 50g、红糖 40g、清水 800ml、红枣 3颗、枸杞 1小把\n\n### 步骤\n1. 生姜去皮切片或拍碎，拍碎更出味；红枣去核。\n2. 锅中加清水和姜片，大火煮沸后转小火煮 5 分钟。\n3. 放入红糖和红枣，搅拌至红糖融化，再煮 3 分钟。\n4. 最后放枸杞焖 1 分钟即可关火。\n\n> 小贴士：怕辣就减少姜量或煮好后滤掉姜片；凉饮需冷藏，2 天内喝完。\n\n==========  菜谱 30  ==========\n\n# 排骨玉米胡萝卜汤\n\n@分类：汤羹\n@时长：80分钟\n@份量：2人份\n@难度：简单\n@封面：c30\n\n### 食材\n排骨 500g、玉米 1根、胡萝卜 1根、枸杞 1小把、八角 2个、桂皮 1段、香叶 2片、大蒜 4瓣、大蒜叶 少许、盐 适量、食用油 少许\n\n### 步骤\n1. 排骨冷水浸泡 30 分钟泡出血水，捞出反复清洗 2-3 遍。\n2. 锅中放少许油，下排骨中小火煸炒 3-4 分钟至表面微黄。\n3. 放入八角、桂皮、香叶、大蒜、大蒜叶炒出香味，把排骨盛出。\n4. 另起锅烧足量开水，水开后放入排骨，撇去浮沫，小火煮 40 分钟。\n5. 放入切好的胡萝卜、玉米和枸杞，加盐调味，继续小火炖 30 分钟。\n6. 出锅前撒葱花，把热汤浇在葱花上烫香即可。\n\n> 小贴士：排骨先煸再炖，汤更香浓；水要一次加足，中途加水会冲淡味道。\n\n==========  菜谱 31  ==========\n\n# 电饭煲排骨糯米饭\n\n@分类：主食\n@时长：90分钟\n@份量：2人份\n@难度：简单\n@封面：c31\n\n### 食材\n排骨 300g、糯米 250g、干香菇 6朵、胡萝卜 半根、玉米 半根、葱姜 适量、生抽 2勺、老抽 1勺、蚝油 1勺、盐 半勺、白糖 半勺、料酒 1勺\n\n### 步骤\n1. 糯米淘洗后清水浸泡 2 小时以上，泡到用手能捏碎最香，时间紧至少泡 30 分钟。\n2. 排骨冷水下锅，加姜片、料酒煮开撇沫，捞出冲净。\n3. 锅里少油放葱姜爆香，下排骨炒到微黄，加生抽、老抽、蚝油、盐、白糖翻炒上色。\n4. 放入香菇、胡萝卜、玉米再炒 1 分钟。\n5. 泡好的糯米沥干铺进电饭煲，把排骨和配料铺在上面，加水刚好没过食材。\n6. 按煮饭键，跳键后焖 10 分钟，用饭勺把米饭和排骨拌匀，撒葱花。\n\n> 小贴士：水量比平时煮饭略少一点，糯米泡过已含水，水多会烂。\n\n==========  菜谱 32  ==========\n\n# 煎冷冻鸡胸肉\n\n@分类：家常菜\n@时长：15分钟\n@份量：2人份\n@难度：简单\n@封面：c32\n\n### 食材\n冷冻鸡胸肉 1块、盐 适量、黑胡椒 适量、食用油 适量、蒜末 少许、生抽 少许\n\n### 步骤\n1. 冷冻鸡胸不用完全化开，冲掉表面冰渣，用厨房纸彻底擦干，防油溅。\n2. 用刀背或肉锤把鸡胸拍薄，厚度均匀更容易熟。\n3. 两面撒盐、黑胡椒，抹一层薄油，静置 3 分钟。\n4. 锅烧热倒油，中小火放鸡胸煎 2-3 分钟至金黄定型，翻面再煎 2-3 分钟。\n5. 盖锅盖焖 3-4 分钟保证内部熟透，用筷子戳最厚处无血水即熟。\n6. 出锅静置 1 分钟后切片，可淋少许生抽加蒜末翻两下增香。\n\n> 小贴士：全程中小火，大火容易外焦里生；焖这步别省，冷冻肉靠它熟透。\n\n==========  菜谱 33  ==========\n\n# 香干炒肉\n\n@分类：家常菜\n@时长：20分钟\n@份量：2人份\n@难度：简单\n@封面：c33\n\n### 食材\n卤香干 200g、猪前腿肉 150g、青椒 2个、生抽 3勺、老抽 半勺、料酒 半勺、玉米淀粉 1小勺、白糖 1小勺、蒜末 3瓣、葱花 少许、食用油 适量、盐 少许\n\n### 步骤\n1. 猪肉逆纹切薄片，加 1 勺生抽、半勺料酒、1 小勺淀粉抓匀，再淋 1 勺油锁水，腌 10 分钟。\n2. 香干切 0.3 厘米薄片，青椒去籽切滚刀块，蒜切末。\n3. 热锅冷油，油温六成热下肉片快速滑炒至变色，约 1 分钟，盛出备用。\n4. 锅中留底油，下香干中小火煎至两面微黄、边缘发焦，约 2 分钟，盛出。\n5. 补少许油爆香蒜末，下青椒大火炒 1 分钟至表皮起皱。\n6. 倒入香干和肉片，淋调味汁（2 勺生抽、半勺老抽、1 小勺白糖），大火翻炒 30 秒，撒葱花出锅。\n\n> 小贴士：香干别频繁翻动，一面煎好再翻另一面才不碎；卤香干本身有咸味，盐要少放或不放。\n\n==========  菜谱 34  ==========\n\n# 黄金裹蛋炒饭\n\n@分类：主食\n@时长：15分钟\n@份量：2人份\n@难度：简单\n@封面：c34\n\n### 食材\n隔夜米饭 2碗、鸡蛋 3个、小葱 2根、火腿肠 1根、玉米粒 少许、盐 1小勺、白胡椒粉 少许、生抽 半勺\n\n### 步骤\n1. 隔夜米饭用勺子压散所有结块，确保粒粒分开；新鲜饭摊开吹干 10 分钟再用。\n2. 鸡蛋加 1 小勺盐、少许白胡椒粉搅匀，倒入米饭抓拌，让每粒米都裹上蛋液，静置 5 分钟。\n3. 火腿肠切小丁，小葱切葱花。\n4. 热锅冷油，倒入裹好蛋液的米饭，中小火慢炒 3-4 分钟，炒到粒粒分明、蛋液定型呈金黄。\n5. 加火腿丁、玉米粒翻炒 1 分钟，喜欢更鲜可淋半勺生抽。\n6. 撒葱花翻炒两下关火。\n\n> 小贴士：米饭一定要打散，结块裹不上蛋液会炒成一坨；全程中小火，大火容易糊锅底。\n\n==========  菜谱 35  ==========\n\n# 蒜蓉上海青\n\n@分类：家常菜\n@时长：8分钟\n@份量：2人份\n@难度：简单\n@封面：c35\n\n### 食材\n上海青 400g、大蒜 4瓣、盐 少许、食用油 适量\n\n### 步骤\n1. 上海青洗净，从中间对半切开，大的切四瓣，沥干水分。\n2. 大蒜切末，分成两半。\n3. 热锅冷油，放一半蒜末爆香，倒入上海青大火快炒 1-2 分钟。\n4. 菜叶变软、颜色变深绿时加剩下的蒜末和少许盐，翻炒均匀出锅。\n\n> 小贴士：蒜末分两次放，一半爆香、一半出锅前放，蒜香层次更足。\n\n==========  菜谱 36  ==========\n\n# 青椒炒腊牛肉\n\n@分类：家常菜\n@时长：25分钟\n@份量：2人份\n@难度：简单\n@封面：c36\n\n### 食材\n腊黄牛肉片 100g、青椒 3个、小米辣 2个、蒜片 4瓣、姜丝 少许、食用油 1勺、生抽 1小勺、鸡精 少许\n\n### 步骤\n1. 腊牛肉用温水浸泡 1-1.5 小时，中途换 1 次水，泡到用手指能轻松掐动，捞出沥干。\n2. 逆纹切 2-3 毫米薄片，太厚咬不动。\n3. 热锅冷油，下蒜片、姜丝、小米辣爆香 10 秒。\n4. 倒入腊牛肉大火快炒 1-2 分钟，炒到肉片微微卷曲、边缘焦黄，盛出备用。\n5. 用余油下青椒块，大火炒 30 秒至表皮起皱断生。\n6. 倒回牛肉，加 1 小勺生抽和少许鸡精，翻炒 10 秒出锅。\n\n> 小贴士：腊牛肉本身偏咸，生抽可省；泡水是关键，不泡直接炒会又硬又咸。\n\n==========  菜谱 37  ==========\n\n# 懒人丸子焖饭\n\n@分类：主食\n@时长：40分钟\n@份量：2人份\n@难度：简单\n@封面：c37\n\n### 食材\n大米 2杯、火锅丸子 200g、玉米 少许、青豆 少许、胡萝卜丁 少许、生抽 1勺、蚝油 半勺、盐 少许\n\n### 步骤\n1. 米淘干净，加水和平时煮饭一样多。\n2. 火锅丸子切半或切花刀，别整颗丢下去，更入味也熟得透。\n3. 把丸子、玉米、青豆、胡萝卜丁丢进米里，加生抽、蚝油和一点点盐搅匀。\n4. 按下煮饭键，跳闸后再焖 5 分钟，拌匀就能吃。\n\n> 小贴士：丸子切花刀更容易吸味；盐要少，蚝油和丸子本身都带咸。\n\n==========  菜谱 38  ==========\n\n# 电饭煲腊肉焖饭\n\n@分类：主食\n@时长：45分钟\n@份量：2人份\n@难度：简单\n@封面：c38\n\n### 食材\n大米 2杯、腊肉 150g、土豆 1个、胡萝卜 半根、香菇 3朵、生抽 1勺、老抽 半勺、蚝油 半勺\n\n### 步骤\n1. 米淘洗干净，按平时煮饭的水量加水。\n2. 腊肉切小丁，土豆、胡萝卜切丁，香菇切片。\n3. 所有食材铺在米上，淋上生抽、老抽、蚝油，不用搅拌。\n4. 按下煮饭键，跳键后焖 10 分钟，拌匀开吃。\n\n> 小贴士：铺好别搅，让蒸汽把调料渗下去；腊肉自带咸味，不用另外加盐。\n\n==========  菜谱 39  ==========\n\n# 辣椒炒卤脆骨\n\n@分类：家常菜\n@时长：15分钟\n@份量：2人份\n@难度：简单\n@封面：c39\n\n### 食材\n卤脆骨 250g、青椒 2根、小米辣 2个、姜蒜末 适量、葱花 少许、生抽 1勺、白糖 半勺、鸡精 少许、盐 少许、食用油 适量\n\n### 步骤\n1. 卤脆骨切成均匀细条，辣椒切斜段，姜蒜切末。\n2. 热锅放少许油，倒入脆骨中小火煸炒 1-2 分钟，把油脂和香味逼出来，盛出备用。\n3. 锅里留底油，爆香姜蒜末，下辣椒段大火炒至变软、表皮微皱。\n4. 倒入脆骨，加 1 勺生抽、少许盐、半勺白糖和鸡精，大火翻炒 1 分钟。\n5. 撒葱花炒匀出锅。\n\n> 小贴士：脆骨已经卤熟带咸味，盐要少放；全程大火快炒才保得住脆感。\n\n==========  菜谱 40  ==========\n\n# 面馆鲜汤底\n\n@分类：汤羹\n@时长：10分钟\n@份量：2人份\n@难度：简单\n@封面：c40\n\n### 食材\n葱花 1小把、紫菜 1撮、虾皮 少许、盐 半勺、白胡椒粉 少许、生抽 1勺、蚝油 半勺、猪油 1小勺、鸡精 少许\n\n### 步骤\n1. 碗里先放葱花、紫菜、虾皮、盐、白胡椒粉、生抽、蚝油、猪油和鸡精。\n2. 煮饺子或煮面的水烧开，先舀 2 勺滚烫的汤冲进碗里，把调料冲化开。\n3. 再把煮好的饺子或面条捞进碗里，搅一搅就能吃。\n\n> 小贴士：一定要加猪油，香味直接翻倍；紫菜加虾皮是鲜味关键，白胡椒粉一点点就够。\n\n==========  菜谱 41  ==========\n\n# 青椒炒豆皮\n\n@分类：家常菜\n@时长：15分钟\n@份量：2人份\n@难度：简单\n@封面：c41\n\n### 食材\n豆皮 200g、青椒 3个、蒜末 1勺、生抽 2勺、盐 少许、白糖 1小勺、葱花 少许、食用油 适量\n\n### 步骤\n1. 豆皮洗净切宽条，青椒去籽切丝。\n2. 豆皮放入沸水焯 1-2 分钟，捞出沥干，去掉豆腥味、口感更软嫩。\n3. 热锅冷油，放蒜末爆香，闻到明显蒜香即可，别炒焦。\n4. 下青椒丝大火快炒 30 秒至断生。\n5. 倒入豆皮大火翻炒 1 分钟，加 2 勺生抽、少许盐、1 小勺白糖炒匀，撒葱花出锅。\n\n> 小贴士：焯豆皮时水里加少许盐和油，颜色更亮口感更滑；喜欢重口可加 1 勺豆瓣酱。\n";
